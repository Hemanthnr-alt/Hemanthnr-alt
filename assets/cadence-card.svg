<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0308" />
      <stop offset="50%" stop-color="#140510" />
      <stop offset="100%" stop-color="#1a0614" />
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .beacon { animation: pulse 1.9s infinite ease-in-out; }
  </style>

  <!-- Frame & Base -->
  <rect x="2" y="2" width="996" height="316" rx="18" fill="url(#bg)" stroke="url(#border)" stroke-width="1.6" filter="url(#cardGlow)" />
  <rect x="2" y="2" width="996" height="316" rx="18" fill="url(#grid)" />

  <!-- Top Window Bar -->
  <g transform="translate(30, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#ef4444" />
    <circle cx="22" cy="6" r="4.5" fill="#f59e0b" />
    <circle cx="38" cy="6" r="4.5" fill="#22c55e" />
    <text x="56" y="10" fill="#94a3b8" font-size="11.5" class="mono">cadence://github.com/Hemanthnr-alt/production-velocity</text>
    
    <rect x="760" y="-3" width="180" height="22" rx="11" fill="#20040f" stroke="#ef4444" stroke-width="1" />
    <circle cx="774" cy="8" r="4" fill="#f59e0b" class="beacon" />
    <text x="786" y="12" fill="#fde047" font-size="9.5" font-weight="bold" class="mono">ACTIVE DISPATCH LIVE</text>
  </g>

  <!-- Title & Headline -->
  <text x="32" y="74" fill="#ffffff" font-size="18" font-weight="800" class="sans">GITHUB PRODUCTION CADENCE &amp; COMMIT VELOCITY</text>
  <text x="32" y="93" fill="#cbd5e1" font-size="12" class="sans">Real-time repository statistics, code distribution weight, and production deliverables</text>

  <!-- 4 Stat Counters in Grid -->
  <g transform="translate(30, 114)">
    <!-- Metric 1: Commits -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="#160512" stroke="#330c25" stroke-width="1" />
      <text x="16" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" class="sans">TOTAL COMMITS (YTD)</text>
      <text x="16" y="58" fill="#ffffff" font-size="24" font-weight="800" class="mono">1,050+</text>
      <text x="140" y="56" fill="url(#goldGrad)" font-size="13" font-weight="bold" class="mono">⚡ HIGH</text>
    </g>

    <!-- Metric 2: Repos -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="#18040a" stroke="#3d0c18" stroke-width="1" />
      <text x="16" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" class="sans">FLAGSHIP REPOSITORIES</text>
      <text x="16" y="58" fill="#ffffff" font-size="24" font-weight="800" class="mono">5 LIVE</text>
      <text x="140" y="56" fill="url(#crimsonGrad)" font-size="13" font-weight="bold" class="mono">★ 100%</text>
    </g>

    <!-- Metric 3: Native Builds -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="#180c04" stroke="#381d06" stroke-width="1" />
      <text x="16" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" class="sans">NATIVE ANDROID BUILDS</text>
      <text x="16" y="58" fill="#ffffff" font-size="24" font-weight="800" class="mono">2 SHIPPED</text>
      <text x="135" y="56" fill="url(#amberGrad)" font-size="12" font-weight="bold" class="mono">APK v1.0</text>
    </g>

    <!-- Metric 4: Local-First -->
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="#08160e" stroke="#0e3a1f" stroke-width="1" />
      <text x="16" y="24" fill="#94a3b8" font-size="10.5" font-weight="600" class="sans">LOCAL-FIRST COVERAGE</text>
      <text x="16" y="58" fill="#ffffff" font-size="24" font-weight="800" class="mono">100%</text>
      <text x="135" y="56" fill="url(#greenGrad)" font-size="13" font-weight="bold" class="mono">OFFLINE</text>
    </g>
  </g>

  <!-- Stack Distribution Weight Header -->
  <text x="32" y="224" fill="#cbd5e1" font-size="11" font-weight="700" class="mono">LANGUAGE &amp; ARCHITECTURE DISTRIBUTION WEIGHT</text>

  <!-- Multi-Segment Distribution Bar -->
  <g transform="translate(30, 234)">
    <rect x="0" y="0" width="940" height="14" rx="7" fill="#190614" />
    <!-- TypeScript 46% -->
    <rect x="0" y="0" width="432" height="14" rx="7" fill="url(#goldGrad)" />
    <!-- Android/Kotlin 24% -->
    <rect x="432" y="0" width="225" height="14" fill="url(#crimsonGrad)" />
    <!-- SQLite & DB 18% -->
    <rect x="657" y="0" width="169" height="14" fill="url(#greenGrad)" />
    <!-- Web/CSS 12% -->
    <rect x="826" y="0" width="114" height="14" rx="7" fill="url(#amberGrad)" />
  </g>

  <!-- Legend Labels -->
  <g transform="translate(30, 276)" font-size="11" class="mono">
    <circle cx="6" cy="4" r="4.5" fill="#f59e0b" />
    <text x="18" y="8" fill="#e2e8f0">TypeScript &amp; React (46%)</text>
    
    <circle cx="280" cy="4" r="4.5" fill="#ef4444" />
    <text x="292" y="8" fill="#e2e8f0">Android &amp; Native Bridge (24%)</text>
    
    <circle cx="580" cy="4" r="4.5" fill="#22c55e" />
    <text x="592" y="8" fill="#e2e8f0">SQLite &amp; Local-First (18%)</text>
    
    <circle cx="820" cy="4" r="4.5" fill="#fbbf24" />
    <text x="832" y="8" fill="#e2e8f0">Next.js &amp; Tailwind (12%)</text>
  </g>
</svg>
