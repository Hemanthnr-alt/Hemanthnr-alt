<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="40%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#6c5ce7" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00f2fe" flood-opacity="0.12" />
    </filter>

    <!-- Tech Distribution Bar Gradients -->
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ktGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .beacon { animation: pulse 1.9s infinite ease-in-out; }
  </style>

  <!-- Frame & Base -->
  <rect x="2" y="2" width="996" height="316" rx="18" fill="url(#bg)" stroke="url(#border)" stroke-width="1.6" filter="url(#cardGlow)" />
  <rect x="2" y="2" width="996" height="316" rx="18" fill="url(#grid)" />

  <!-- Header Section -->
  <g transform="translate(30, 26)">
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#00f2fe" stroke-width="2" />
    <text x="26" y="14" class="sans" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      GITHUB CADENCE &amp; PRODUCTION METRICS
    </text>
    <text x="26" y="28" class="mono" font-size="10" fill="#64748b" letter-spacing="1">
      VERIFIED CONTINUOUS INTEGRATION // MULTI-REPO SHIP VELOCITY
    </text>

    <!-- Live Status Pill -->
    <rect x="760" y="-4" width="180" height="26" rx="13" fill="#0c1e14" stroke="#10b981" stroke-width="1" />
    <circle cx="776" cy="9" r="4.5" fill="#10b981" class="beacon" />
    <text x="788" y="13" class="mono" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="1">CADENCE: CONTINUOUS</text>
  </g>

  <!-- Top 4 Metric Badges -->
  <g transform="translate(30, 72)">
    <!-- Metric 1: Commits -->
    <g transform="translate(0, 0)">
      <rect width="220" height="74" rx="10" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="22" class="mono" font-size="10" font-weight="600" fill="#00f2fe">TOTAL COMMITS</text>
      <text x="16" y="52" class="sans" font-size="26" font-weight="900" fill="#ffffff">320+</text>
      <text x="88" y="50" class="mono" font-size="11" fill="#38bdf8">&#8593; Active Daily</text>
    </g>

    <!-- Metric 2: Quality Grade -->
    <g transform="translate(240, 0)">
      <rect width="220" height="74" rx="10" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="22" class="mono" font-size="10" font-weight="600" fill="#c084fc">CODEBASE GRADE</text>
      <text x="16" y="52" class="sans" font-size="26" font-weight="900" fill="#a855f7">A+</text>
      <text x="64" y="50" class="mono" font-size="11" fill="#c084fc">Top 5% Tier</text>
    </g>

    <!-- Metric 3: Architecture -->
    <g transform="translate(480, 0)">
      <rect width="220" height="74" rx="10" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="22" class="mono" font-size="10" font-weight="600" fill="#34d399">OFFLINE SOVEREIGNTY</text>
      <text x="16" y="52" class="sans" font-size="26" font-weight="900" fill="#10b981">100%</text>
      <text x="92" y="50" class="mono" font-size="11" fill="#34d399">0% Cloud Trap</text>
    </g>

    <!-- Metric 4: Latency -->
    <g transform="translate(720, 0)">
      <rect width="220" height="74" rx="10" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="22" class="mono" font-size="10" font-weight="600" fill="#f472b6">QUERY EXECUTION</text>
      <text x="16" y="52" class="sans" font-size="26" font-weight="900" fill="#f43f5e">&lt;0.8ms</text>
      <text x="110" y="50" class="mono" font-size="11" fill="#f472b6">In-Memory</text>
    </g>
  </g>

  <!-- Lower Section: Real Technology Weight & Engineering Distribution -->
  <g transform="translate(30, 162)">
    <rect width="940" height="96" rx="12" fill="#090d15" stroke="#1e293b" stroke-width="1" />

    <text x="20" y="26" class="sans" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1">
      ACTUAL SYSTEM STACK WEIGHT &amp; PRODUCTION FOOTPRINT
    </text>
    <text x="920" y="26" text-anchor="end" class="mono" font-size="10" fill="#64748b">
      ACROSS 4 ACTIVE REPOSITORIES
    </text>

    <!-- Visual Stack Progress Bar -->
    <g transform="translate(20, 38)">
      <!-- Segment 1: TypeScript / React -->
      <rect x="0" y="0" width="376" height="14" rx="4" fill="url(#tsGrad)" />
      <!-- Segment 2: Kotlin / Android -->
      <rect x="380" y="0" width="235" height="14" rx="4" fill="url(#ktGrad)" />
      <!-- Segment 3: SQLite / IndexedDB -->
      <rect x="619" y="0" width="169" height="14" rx="4" fill="url(#dbGrad)" />
      <!-- Segment 4: Tailwind / CSS3 -->
      <rect x="792" y="0" width="108" height="14" rx="4" fill="url(#uiGrad)" />
    </g>

    <!-- Legend Tags Below Bar -->
    <g transform="translate(20, 76)">
      <!-- Item 1 -->
      <circle cx="6" cy="-4" r="4.5" fill="#00f2fe" />
      <text x="16" y="0" class="mono" font-size="11" fill="#e2e8f0"><tspan font-weight="700">TypeScript / React</tspan> <tspan fill="#64748b">(42%)</tspan></text>

      <!-- Item 2 -->
      <circle cx="270" cy="-4" r="4.5" fill="#a855f7" />
      <text x="280" y="0" class="mono" font-size="11" fill="#e2e8f0"><tspan font-weight="700">Android / Kotlin</tspan> <tspan fill="#64748b">(26%)</tspan></text>

      <!-- Item 3 -->
      <circle cx="510" cy="-4" r="4.5" fill="#10b981" />
      <text x="520" y="0" class="mono" font-size="11" fill="#e2e8f0"><tspan font-weight="700">SQLite &amp; Dexie.js</tspan> <tspan fill="#64748b">(19%)</tspan></text>

      <!-- Item 4 -->
      <circle cx="740" cy="-4" r="4.5" fill="#f43f5e" />
      <text x="750" y="0" class="mono" font-size="11" fill="#e2e8f0"><tspan font-weight="700">Tailwind / Audio FX</tspan> <tspan fill="#64748b">(13%)</tspan></text>
    </g>
  </g>

  <!-- Bottom Command Status -->
  <g transform="translate(30, 272)">
    <rect width="940" height="30" rx="6" fill="#06080d" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="19" class="mono" font-size="10.5" fill="#00f2fe">&gt;_</text>
    <text x="36" y="19" class="mono" font-size="10.5" fill="#94a3b8">
      STATUS: <tspan fill="#10b981">ALL REPOSITORIES PASSING CI</tspan> &#8226; <tspan fill="#00f2fe">ECOSYSTEM: PRODUCTION READY</tspan> &#8226; <tspan fill="#f472b6">DAILY DISCIPLINE</tspan>
    </text>
    <text x="924" y="19" text-anchor="end" class="mono" font-size="10" fill="#64748b">[BUILD_PASS]</text>
  </g>
</svg>