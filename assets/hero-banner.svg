<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradients -->
    <linearGradient id="deep-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020306" />
      <stop offset="30%" stop-color="#060913" />
      <stop offset="65%" stop-color="#0c0721" />
      <stop offset="100%" stop-color="#040f1c" />
    </linearGradient>

    <!-- Multi-Chromatic Aurora Flares -->
    <radialGradient id="aurora-purple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-cyan" cx="82%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.48" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-pink" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-emerald" cx="95%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Text Gradients -->
    <linearGradient id="text-holo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#dbeafe" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Badge Laser Border -->
    <linearGradient id="laser-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="30%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Wave Multi-Tone Gradients -->
    <linearGradient id="wave-layer-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#7928ca" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#00f2fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="wave-layer-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="25%" stop-color="#160c33" />
      <stop offset="55%" stop-color="#6c5ce7" />
      <stop offset="85%" stop-color="#00cec9" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Filters -->
    <filter id="intense-laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b1" />
      <feGaussianBlur stdDeviation="4" result="b2" />
      <feGaussianBlur stdDeviation="1.5" result="b3" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="b3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="title-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>

    <!-- Perspective Grid Lines Clip -->
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>
    <mask id="grid-mask">
      <rect width="1200" height="420" fill="url(#grid-fade)" />
    </mask>

    <!-- Flat Cyber Grid for Upper Section -->
    <pattern id="upper-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.05" />
      <circle cx="32" cy="0" r="0.8" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.25; transform: scale(0.7); } }
    @keyframes sonar-wave { 0% { r: 5px; opacity: 0.9; } 100% { r: 26px; opacity: 0; } }
    @keyframes twinkle-fast { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 0.15; transform: scale(0.35); } }
    @keyframes twinkle-slow { 0%, 100% { opacity: 0.2; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes laser-pulse { 0%, 100% { stroke-opacity: 0.95; } 50% { stroke-opacity: 0.6; } }
    @keyframes eq-1 { 0%, 100% { height: 16px; y: 4px; } 50% { height: 6px; y: 14px; } }
    @keyframes eq-2 { 0%, 100% { height: 8px; y: 12px; } 50% { height: 20px; y: 0px; } }
    @keyframes eq-3 { 0%, 100% { height: 18px; y: 2px; } 50% { height: 10px; y: 10px; } }
    @keyframes eq-4 { 0%, 100% { height: 12px; y: 8px; } 50% { height: 4px; y: 16px; } }

    .pulse { animation: pulse-dot 1.8s infinite ease-in-out; }
    .sonar { animation: sonar-wave 2.2s infinite ease-out; }
    .star-a { animation: twinkle-fast 2.5s infinite ease-in-out; }
    .star-b { animation: twinkle-slow 3.2s infinite ease-in-out; }
    .laser { animation: laser-pulse 2.8s infinite ease-in-out; }
    .bar-1 { animation: eq-1 1.2s infinite ease-in-out; }
    .bar-2 { animation: eq-2 1.4s infinite ease-in-out; }
    .bar-3 { animation: eq-3 1.1s infinite ease-in-out; }
    .bar-4 { animation: eq-4 1.5s infinite ease-in-out; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif; }
  </style>

  <!-- Canvas Base -->
  <rect width="1200" height="420" fill="url(#deep-canvas)" />
  <rect width="1200" height="420" fill="url(#upper-grid)" />

  <!-- 3D Perspective Tron Grid Lines at Bottom Horizon -->
  <g mask="url(#grid-mask)" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.35">
    <!-- Converging Perspective Rays -->
    <line x1="600" y1="210" x2="-200" y2="420" />
    <line x1="600" y1="210" x2="0" y2="420" />
    <line x1="600" y1="210" x2="150" y2="420" />
    <line x1="600" y1="210" x2="300" y2="420" />
    <line x1="600" y1="210" x2="450" y2="420" />
    <line x1="600" y1="210" x2="550" y2="420" />
    <line x1="600" y1="210" x2="650" y2="420" />
    <line x1="600" y1="210" x2="750" y2="420" />
    <line x1="600" y1="210" x2="900" y2="420" />
    <line x1="600" y1="210" x2="1050" y2="420" />
    <line x1="600" y1="210" x2="1200" y2="420" />
    <line x1="600" y1="210" x2="1400" y2="420" />
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="260" x2="1200" y2="260" stroke-opacity="0.15" />
    <line x1="0" y1="295" x2="1200" y2="295" stroke-opacity="0.25" />
    <line x1="0" y1="335" x2="1200" y2="335" stroke-opacity="0.4" />
    <line x1="0" y1="380" x2="1200" y2="380" stroke-opacity="0.6" />
  </g>

  <!-- Aurora Light Spheres -->
  <circle cx="240" cy="160" r="360" fill="url(#aurora-purple)" />
  <circle cx="960" cy="140" r="380" fill="url(#aurora-cyan)" />
  <circle cx="600" cy="320" r="260" fill="url(#aurora-pink)" />
  <circle cx="1120" cy="300" r="230" fill="url(#aurora-emerald)" />

  <!-- Constellation Twinkles -->
  <g fill="#00f2fe">
    <circle cx="100" cy="90" r="1.5" class="star-a" />
    <circle cx="170" cy="190" r="1.3" class="star-b" />
    <circle cx="280" cy="70" r="2.0" class="star-a" />
    <circle cx="910" cy="85" r="1.7" class="star-b" />
    <circle cx="1030" cy="180" r="1.5" class="star-a" />
    <circle cx="1110" cy="100" r="2.2" class="star-b" />
    <circle cx="970" cy="250" r="1.4" class="star-a" />
    <circle cx="150" cy="270" r="1.8" class="star-b" />
    <circle cx="70" cy="150" r="1.3" class="star-a" />
    <circle cx="1130" cy="220" r="1.6" class="star-b" />
  </g>

  <!-- Corner Tech Geometry -->
  <g stroke="#00f2fe" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <!-- Top-Left Bracket -->
    <path d="M 32 54 L 32 26 L 60 26" />
    <circle cx="32" cy="26" r="2.5" fill="#00f2fe" />
    <line x1="68" y1="26" x2="145" y2="26" stroke="#00f2fe" stroke-opacity="0.25" stroke-dasharray="3 3" />
    <!-- Top-Right Bracket -->
    <path d="M 1168 54 L 1168 26 L 1140 26" />
    <circle cx="1168" cy="26" r="2.5" fill="#00f2fe" />
    <line x1="1132" y1="26" x2="1055" y2="26" stroke="#00f2fe" stroke-opacity="0.25" stroke-dasharray="3 3" />
  </g>

  <!-- Top-Left Soundwave Audio Visualizer -->
  <g transform="translate(60, 26)">
    <!-- Animated EQ Bars -->
    <rect x="0" width="3" rx="1.5" fill="#00f2fe" class="bar-1" />
    <rect x="6" width="3" rx="1.5" fill="#00f2fe" class="bar-2" />
    <rect x="12" width="3" rx="1.5" fill="#38bdf8" class="bar-3" />
    <rect x="18" width="3" rx="1.5" fill="#818cf8" class="bar-4" />
    <text x="28" y="14" class="mono" font-size="11" fill="#00f2fe" fill-opacity="0.9" letter-spacing="1.5">
      AUDIO_ENGINE: 40Hz ALPHA // 0xHEMANTH
    </text>
  </g>

  <!-- Top-Right Telemetry Tag -->
  <g transform="translate(1140, 32)">
    <text text-anchor="end" class="mono" font-size="11" fill="#10b981" fill-opacity="0.9" letter-spacing="1.5">
      &#9679; 100% LOCAL-FIRST &#8226; AIR-GAPPED READY
    </text>
  </g>

  <!-- Center Floating Glassmorphic Status Dock -->
  <g transform="translate(360, 48)">
    <rect x="0" y="0" width="480" height="38" rx="19" fill="#090d16" fill-opacity="0.92" stroke="url(#laser-border)" stroke-width="1.6" filter="url(#intense-laser-glow)" />
    <!-- Live Beacon Dot + Sonar -->
    <circle cx="30" cy="19" r="5" fill="#00f2fe" class="pulse" />
    <circle cx="30" cy="19" r="6" fill="none" stroke="#00f2fe" stroke-width="1.2" class="sonar" />
    <!-- Pill Text -->
    <text x="52" y="24" class="mono" font-size="12.5" font-weight="800" fill="#f8fafc" letter-spacing="2">
      SYSTEM STATUS: <tspan fill="#00f2fe">LOCKED IN</tspan> &#8226; <tspan fill="#10b981">HIGH VELOCITY</tspan>
    </text>
    <!-- Right decorative chip -->
    <rect x="400" y="8" width="66" height="22" rx="11" fill="#0e1728" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
    <text x="433" y="23" text-anchor="middle" class="mono" font-size="10" fill="#38bdf8" font-weight="800">PROD v3</text>
  </g>

  <!-- Main Hero Title with Dual Sci-Fi Brackets -->
  <g filter="url(#title-glow)">
    <!-- Flanking Cyber Brackets -->
    <text x="210" y="186" text-anchor="middle" class="mono" font-size="64" font-weight="300" fill="#00f2fe" fill-opacity="0.5">&#10216;</text>
    <text x="990" y="186" text-anchor="middle" class="mono" font-size="64" font-weight="300" fill="#00f2fe" fill-opacity="0.5">&#10217;</text>

    <!-- Main Title -->
    <text x="600" y="186" text-anchor="middle" class="display" font-size="86" font-weight="900" fill="url(#text-holo)" letter-spacing="6">
      HEMANTH NAIDU
    </text>
  </g>

  <!-- Subtitle with Glowing Color Accent Tokens -->
  <g filter="url(#title-glow)">
    <text x="600" y="238" text-anchor="middle" class="display" font-size="22" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      Architecting <tspan fill="#00f2fe" font-weight="800">Local-First Systems</tspan> &#8226; <tspan fill="#3ddc84" font-weight="800">Android Specialist</tspan> &#8226; <tspan fill="#c084fc" font-weight="800">Full-Stack Engineer</tspan>
    </text>
  </g>

  <!-- Tactical Architecture Pill Dock (4 Columns) -->
  <g transform="translate(170, 268)">
    <!-- Pill 1: 0ms Latency -->
    <g transform="translate(0, 0)">
      <rect width="200" height="34" rx="17" fill="#070b12" fill-opacity="0.9" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="100" y="22" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1">&#9889; 0ms ZERO-LATENCY</text>
    </g>
    <!-- Pill 2: Sovereign Storage -->
    <g transform="translate(220, 0)">
      <rect width="210" height="34" rx="17" fill="#070b12" fill-opacity="0.9" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1.2" />
      <text x="105" y="22" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="1">&#128737; CLIENT SOVEREIGN</text>
    </g>
    <!-- Pill 3: Android Native -->
    <g transform="translate(450, 0)">
      <rect width="200" height="34" rx="17" fill="#070b12" fill-opacity="0.9" stroke="#3ddc84" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="100" y="22" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#4ade80" letter-spacing="1">&#128241; ANDROID NATIVE</text>
    </g>
    <!-- Pill 4: Production Shipped -->
    <g transform="translate(670, 0)">
      <rect width="190" height="34" rx="17" fill="#070b12" fill-opacity="0.9" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="95" y="22" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="1">&#128293; PROD SHIPPED</text>
    </g>
  </g>

  <!-- Multi-Layered Cybernetic Waving Horizon -->
  <!-- Layer 1: Ambient Under-wave -->
  <path d="M 0 365 C 220 320, 480 415, 740 355 C 930 315, 1080 375, 1200 335 L 1200 420 L 0 420 Z" fill="url(#wave-layer-1)" />

  <!-- Layer 2: Main Foreground Wave -->
  <path d="M 0 382 C 280 410, 530 335, 820 380 C 990 405, 1110 360, 1200 375 L 1200 420 L 0 420 Z" fill="url(#wave-layer-2)" />

  <!-- Layer 3: Neon Laser Crest with Intense Glow Filter -->
  <path d="M 0 382 C 280 410, 530 335, 820 380 C 990 405, 1110 360, 1200 375" fill="none" stroke="#00f2fe" stroke-width="3.5" class="laser" filter="url(#intense-laser-glow)" />
</svg>