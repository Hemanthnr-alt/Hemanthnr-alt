<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Deep Canvas Background -->
    <linearGradient id="chassis-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="40%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <!-- Fiber-Optic Border Gradient -->
    <linearGradient id="fiber-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#6c5ce7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="75%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Inner Panel Background -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080b12" stop-opacity="0.95" />
    </linearGradient>

    <!-- Aurora Volumetric Blooms -->
    <radialGradient id="aurora-center" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-left" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-right" cx="85%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Hologram Gradient -->
    <linearGradient id="holo-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f1f5f9" />
      <stop offset="65%" stop-color="#c7d2fe" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laser-intense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b1" />
      <feGaussianBlur stdDeviation="2.5" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="monolith-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#00f2fe" flood-opacity="0.2" />
    </filter>

    <!-- Circuit Dot Matrix -->
    <pattern id="dot-matrix" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="#00f2fe" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse-beacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    @keyframes scan-sweep {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(440px); opacity: 0.1; }
    }
    @keyframes eq-a { 0%, 100% { height: 16px; y: 4px; } 50% { height: 6px; y: 14px; } }
    @keyframes eq-b { 0%, 100% { height: 8px; y: 12px; } 50% { height: 20px; y: 0px; } }
    @keyframes eq-c { 0%, 100% { height: 18px; y: 2px; } 50% { height: 10px; y: 10px; } }
    @keyframes eq-d { 0%, 100% { height: 12px; y: 8px; } 50% { height: 4px; y: 16px; } }

    .orbit-cw { animation: spin-cw 24s linear infinite; transform-origin: 600px 145px; }
    .orbit-ccw { animation: spin-ccw 16s linear infinite; transform-origin: 600px 145px; }
    .beacon { animation: pulse-beacon 1.8s infinite ease-in-out; }
    .scanner { animation: scan-sweep 6s linear infinite; }
    .bar-1 { animation: eq-a 1.2s infinite ease-in-out; }
    .bar-2 { animation: eq-b 1.5s infinite ease-in-out; }
    .bar-3 { animation: eq-c 1.1s infinite ease-in-out; }
    .bar-4 { animation: eq-d 1.4s infinite ease-in-out; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Outer Console Chassis -->
  <rect x="2" y="2" width="1196" height="436" rx="20" fill="url(#chassis-bg)" stroke="url(#fiber-border)" stroke-width="1.6" filter="url(#monolith-shadow)" />
  <rect x="2" y="2" width="1196" height="436" rx="20" fill="url(#dot-matrix)" />

  <!-- Ambient Light Volumes -->
  <circle cx="200" cy="180" r="280" fill="url(#aurora-left)" />
  <circle cx="1000" cy="180" r="280" fill="url(#aurora-right)" />
  <circle cx="600" cy="200" r="320" fill="url(#aurora-center)" />

  <!-- Animated Laser Scanline Effect -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00f2fe" stroke-width="1.5" class="scanner" stroke-opacity="0.3" filter="url(#neon-glow)" />

  <!-- ==================== TOP OS HEADER BAR ==================== -->
  <g transform="translate(0, 0)">
    <!-- Header Surface Strip -->
    <rect x="2" y="2" width="1196" height="46" rx="18" fill="#080b12" fill-opacity="0.9" />
    <line x1="2" y1="48" x2="1198" y2="48" stroke="#1e293b" stroke-width="1" />

    <!-- macOS / Cyber Window Indicators -->
    <g transform="translate(24, 20)">
      <circle cx="0" cy="4" r="5.5" fill="#ef4444" fill-opacity="0.9" />
      <circle cx="18" cy="4" r="5.5" fill="#f59e0b" fill-opacity="0.9" />
      <circle cx="36" cy="4" r="5.5" fill="#10b981" fill-opacity="0.9" />
    </g>

    <!-- Center OS Breadcrumb Tab -->
    <g transform="translate(420, 10)">
      <rect width="360" height="28" rx="14" fill="#0f1523" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="20" cy="14" r="4" fill="#00f2fe" class="beacon" />
      <text x="36" y="18" class="mono" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="1.5">
        LOCK_IN_OS // KERNEL_ACTIVE [0x01]
      </text>
      <rect x="294" y="6" width="54" height="16" rx="8" fill="#1e293b" />
      <text x="321" y="18" text-anchor="middle" class="mono" font-size="9" font-weight="800" fill="#38bdf8">LIVE</text>
    </g>

    <!-- Right HUD Status Badges -->
    <g transform="translate(1170, 24)">
      <text text-anchor="end" class="mono" font-size="10.5" fill="#10b981" letter-spacing="1.5">
        &#9679; 0ms LATENCY &#8226; AIR-GAPPED 100%
      </text>
    </g>
  </g>

  <!-- ==================== THREE-COLUMN HUD WORKSPACE ==================== -->

  <!-- LEFT PANE: LIVE SYNTAX EDITOR MODULE -->
  <g transform="translate(28, 64)">
    <rect width="280" height="250" rx="14" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Editor Header -->
    <rect width="280" height="30" rx="14" fill="#080c14" />
    <line x1="0" y1="30" x2="280" y2="30" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="20" class="mono" font-size="10.5" font-weight="700" fill="#64748b">&#9670; architecture.ts</text>
    <rect x="230" y="7" width="38" height="16" rx="8" fill="#0c1e14" stroke="#10b981" stroke-width="0.8" />
    <text x="249" y="18" text-anchor="middle" class="mono" font-size="9" fill="#34d399" font-weight="700">PASS</text>

    <!-- Code Lines -->
    <g transform="translate(14, 48)" class="mono" font-size="10.5" letter-spacing="0.5">
      <text y="14" fill="#475569">01 <tspan fill="#ec4899">import</tspan> <tspan fill="#f8fafc">{ Core }</tspan> <tspan fill="#ec4899">from</tspan> <tspan fill="#38bdf8">'@local'</tspan>;</text>
      <text y="34" fill="#475569">02</text>
      <text y="54" fill="#475569">03 <tspan fill="#818cf8">const</tspan> <tspan fill="#f8fafc">engine</tspan> = <tspan fill="#818cf8">new</tspan> <tspan fill="#00f2fe">LockIn</tspan>({</text>
      <text y="74" fill="#475569">04   storage: <tspan fill="#34d399">'SQLite'</tspan>,</text>
      <text y="94" fill="#475569">05   cloudReliance: <tspan fill="#f43f5e">0.00</tspan>,</text>
      <text y="114" fill="#475569">06   latency: <tspan fill="#38bdf8">'sub-1ms'</tspan>,</text>
      <text y="134" fill="#475569">07   runtime: <tspan fill="#c084fc">'Android'</tspan></text>
      <text y="154" fill="#475569">08 });</text>
      <text y="174" fill="#475569">09 <tspan fill="#64748b">// 100% sovereign computation</tspan></text>
      <text y="194" fill="#475569">10 <tspan fill="#ec4899">export default</tspan> <tspan fill="#f8fafc">engine;</tspan></text>
    </g>
  </g>

  <!-- CENTER PANE: HOLOGRAPHIC ORBITAL CORE & MAIN IDENTITY -->
  <g transform="translate(600, 190)">
    <!-- Rotating Cyber Orbit 1 -->
    <circle cx="0" cy="-45" r="54" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="8 6" class="orbit-cw" />
    <!-- Rotating Cyber Orbit 2 -->
    <circle cx="0" cy="-45" r="42" fill="none" stroke="#c084fc" stroke-width="1.4" stroke-opacity="0.45" stroke-dasharray="14 10" class="orbit-ccw" />
    
    <!-- Central Pulsing Emblem Badge -->
    <circle cx="0" cy="-45" r="28" fill="#080c14" stroke="url(#fiber-border)" stroke-width="1.5" />
    <text x="0" y="-38" text-anchor="middle" class="mono" font-size="18" font-weight="900" fill="#00f2fe">HN</text>

    <!-- Main Hero Typography -->
    <g filter="url(#monolith-shadow)">
      <text x="0" y="36" text-anchor="middle" class="display" font-size="64" font-weight="900" fill="url(#holo-title)" letter-spacing="5">
        HEMANTH NAIDU
      </text>
    </g>

    <!-- Core Subtitle Doctrine -->
    <text x="0" y="72" text-anchor="middle" class="display" font-size="16.5" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
      Architecting <tspan fill="#00f2fe" font-weight="800">Local-First Systems</tspan> &#8226; <tspan fill="#3ddc84" font-weight="800">Android Specialist</tspan> &#8226; <tspan fill="#c084fc" font-weight="800">Full-Stack</tspan>
    </text>

    <!-- Dynamic Status Badge -->
    <g transform="translate(-165, 92)">
      <rect width="330" height="28" rx="14" fill="#0a0f1c" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="14" r="4" fill="#00f2fe" class="beacon" />
      <text x="32" y="18" class="mono" font-size="10.5" font-weight="700" fill="#f8fafc" letter-spacing="1.5">
        DOCTRINE: <tspan fill="#00f2fe">DETERMINISTIC</tspan> &#8226; <tspan fill="#10b981">SOVEREIGN</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT PANE: TELEMETRY GAUGES & AUDIO SPECTRUM -->
  <g transform="translate(892, 64)">
    <rect width="280" height="250" rx="14" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1.2" />

    <!-- Telemetry Header -->
    <rect width="280" height="30" rx="14" fill="#080c14" />
    <line x1="0" y1="30" x2="280" y2="30" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="20" class="mono" font-size="10.5" font-weight="700" fill="#64748b">&#9670; telemetry_hud.sys</text>
    
    <!-- Mini Audio Waveform -->
    <g transform="translate(230, 8)">
      <rect x="0" width="3" rx="1.5" fill="#00f2fe" class="bar-1" />
      <rect x="6" width="3" rx="1.5" fill="#38bdf8" class="bar-2" />
      <rect x="12" width="3" rx="1.5" fill="#818cf8" class="bar-3" />
      <rect x="18" width="3" rx="1.5" fill="#c084fc" class="bar-4" />
    </g>

    <!-- Gauge Metric 1: Data Sovereignty Circular Dial -->
    <g transform="translate(20, 50)">
      <circle cx="34" cy="34" r="28" fill="none" stroke="#1e293b" stroke-width="5" />
      <circle cx="34" cy="34" r="28" fill="none" stroke="#00f2fe" stroke-width="5" stroke-dasharray="176" stroke-dashoffset="0" stroke-linecap="round" />
      <text x="34" y="38" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#00f2fe">100%</text>
      
      <text x="76" y="26" class="sans" font-size="13" font-weight="800" fill="#f8fafc">Local-First Index</text>
      <text x="76" y="44" class="mono" font-size="10" fill="#64748b">IndexedDB + SQLite</text>
    </g>

    <!-- Gauge Metric 2: Codebase Grade -->
    <g transform="translate(20, 124)">
      <circle cx="34" cy="34" r="28" fill="none" stroke="#1e293b" stroke-width="5" />
      <circle cx="34" cy="34" r="28" fill="none" stroke="#a855f7" stroke-width="5" stroke-dasharray="176" stroke-dashoffset="20" stroke-linecap="round" />
      <text x="34" y="39" text-anchor="middle" class="mono" font-size="13" font-weight="900" fill="#c084fc">A+</text>
      
      <text x="76" y="26" class="sans" font-size="13" font-weight="800" fill="#f8fafc">Production Cadence</text>
      <text x="76" y="44" class="mono" font-size="10" fill="#64748b">320+ Git Commits</text>
    </g>

    <!-- Bottom Specs Strip -->
    <g transform="translate(14, 204)">
      <rect width="252" height="32" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="20" class="mono" font-size="9.5" fill="#38bdf8">QUERY_SPEED: &lt;0.8ms</text>
      <text x="240" y="20" text-anchor="end" class="mono" font-size="9.5" fill="#10b981">60 FPS VSYNC</text>
    </g>
  </g>

  <!-- ==================== BOTTOM FIBER-OPTIC RUNWAY & PILLS ==================== -->
  <g transform="translate(28, 332)">
    <rect width="1144" height="88" rx="14" fill="#080c14" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />

    <!-- 4 Tactical Execution Modules -->
    <!-- Mod 1 -->
    <g transform="translate(24, 18)">
      <rect width="256" height="52" rx="10" fill="#0c111c" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1" />
      <text x="16" y="24" class="mono" font-size="11" font-weight="800" fill="#00f2fe">&#9889; 0ms ZERO-LATENCY</text>
      <text x="16" y="42" class="sans" font-size="11" fill="#94a3b8">Deterministic In-Memory DB</text>
    </g>

    <!-- Mod 2 -->
    <g transform="translate(300, 18)">
      <rect width="256" height="52" rx="10" fill="#0c111c" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1" />
      <text x="16" y="24" class="mono" font-size="11" font-weight="800" fill="#c7d2fe">&#128737; CLIENT SOVEREIGNTY</text>
      <text x="16" y="42" class="sans" font-size="11" fill="#94a3b8">Zero Cloud &#8226; Zero Telemetry</text>
    </g>

    <!-- Mod 3 -->
    <g transform="translate(576, 18)">
      <rect width="256" height="52" rx="10" fill="#0c111c" stroke="#3ddc84" stroke-opacity="0.35" stroke-width="1" />
      <text x="16" y="24" class="mono" font-size="11" font-weight="800" fill="#4ade80">&#128241; ANDROID HARDWARE</text>
      <text x="16" y="42" class="sans" font-size="11" fill="#94a3b8">Doze-Proof Foreground Svcs</text>
    </g>

    <!-- Mod 4 -->
    <g transform="translate(852, 18)">
      <rect width="268" height="52" rx="10" fill="#0c111c" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1" />
      <text x="16" y="24" class="mono" font-size="11" font-weight="800" fill="#f472b6">&#128293; PRODUCTION SHIPPED</text>
      <text x="16" y="42" class="sans" font-size="11" fill="#94a3b8">Lock In &amp; LockIn Fitness</text>
    </g>
  </g>

  <!-- Bottom Laser Edge Accent -->
  <line x1="28" y1="432" x2="1172" y2="432" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8" filter="url(#laser-intense)" />
</svg>