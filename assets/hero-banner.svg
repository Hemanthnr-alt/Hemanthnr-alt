<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="30%" stop-color="#090d15" />
      <stop offset="70%" stop-color="#110d28" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="glow-violet" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.36" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-magenta" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="badge-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Bottom Wave Gradients -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#7928ca" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d14" />
      <stop offset="25%" stop-color="#180f38" />
      <stop offset="55%" stop-color="#6c5ce7" />
      <stop offset="85%" stop-color="#00cec9" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="name-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.06" />
      <circle cx="40" cy="0" r="1" fill="#00f2fe" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    @keyframes sonar-ring {
      0% { r: 6px; opacity: 0.8; }
      100% { r: 20px; opacity: 0; }
    }
    @keyframes twinkle-a {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.15; transform: scale(0.5); }
    }
    @keyframes twinkle-b {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    .pulse-beacon { animation: pulse-dot 2s infinite ease-in-out; }
    .sonar { animation: sonar-ring 2.4s infinite ease-out; }
    .star-1 { animation: twinkle-a 3s infinite ease-in-out; }
    .star-2 { animation: twinkle-b 2.5s infinite ease-in-out; }
    .mono-type { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .display-type { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="370" fill="url(#bg-grad)" />
  <rect width="1200" height="370" fill="url(#cyber-grid)" />

  <!-- Ambient Light blooms -->
  <circle cx="280" cy="140" r="320" fill="url(#glow-violet)" />
  <circle cx="920" cy="120" r="340" fill="url(#glow-cyan)" />
  <circle cx="600" cy="280" r="230" fill="url(#glow-magenta)" />

  <!-- Constellation Particles / Cyber Stars -->
  <g fill="#00f2fe">
    <circle cx="140" cy="95" r="1.5" class="star-1" />
    <circle cx="210" cy="190" r="1.2" class="star-2" />
    <circle cx="340" cy="70" r="1.8" class="star-1" />
    <circle cx="860" cy="75" r="1.5" class="star-2" />
    <circle cx="1020" cy="180" r="1.3" class="star-1" />
    <circle cx="1080" cy="110" r="2" class="star-2" />
    <circle cx="950" cy="240" r="1.4" class="star-1" />
    <circle cx="180" cy="270" r="1.5" class="star-2" />
  </g>

  <!-- Corner Circuit Accents & Bracket Geometry -->
  <g stroke="#00f2fe" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <!-- Top-Left -->
    <path d="M 32 50 L 32 30 L 52 30" />
    <circle cx="32" cy="30" r="2.5" fill="#00f2fe" />
    <line x1="60" y1="30" x2="130" y2="30" stroke="#00f2fe" stroke-opacity="0.25" stroke-dasharray="3 3" />

    <!-- Top-Right -->
    <path d="M 1168 50 L 1168 30 L 1148 30" />
    <circle cx="1168" cy="30" r="2.5" fill="#00f2fe" />
    <line x1="1140" y1="30" x2="1070" y2="30" stroke="#00f2fe" stroke-opacity="0.25" stroke-dasharray="3 3" />
  </g>

  <!-- Top Metadata HUD Displays -->
  <text x="56" y="40" class="mono-type" font-size="11" fill="#00f2fe" fill-opacity="0.8" letter-spacing="2">
    OPERATOR // 0xHEMANTH • LOCAL_FIRST_CORE
  </text>
  <text x="1144" y="40" text-anchor="end" class="mono-type" font-size="11" fill="#10b981" fill-opacity="0.9" letter-spacing="2">
    ● 100% CLIENT-SIDE • ZERO TELEMETRY
  </text>

  <!-- High-Tech Central Status Badge -->
  <g transform="translate(385, 50)">
    <rect x="0" y="0" width="430" height="34" rx="17" fill="#0c1017" fill-opacity="0.9" stroke="url(#badge-border-grad)" stroke-width="1.4" filter="url(#neon-glow)" />
    <!-- Pulsing Live Dot + Sonar Ring -->
    <circle cx="26" cy="17" r="5" fill="#00f2fe" class="pulse-beacon" />
    <circle cx="26" cy="17" r="6" fill="none" stroke="#00f2fe" stroke-width="1" class="sonar" />
    <text x="46" y="21.5" class="mono-type" font-size="12" font-weight="700" fill="#f1f5f9" letter-spacing="2">
      STATUS: <tspan fill="#00f2fe">LOCKED IN</tspan> • <tspan fill="#10b981">PRODUCTION ACTIVE</tspan>
    </text>
  </g>

  <!-- Main Hero Title -->
  <g filter="url(#name-shadow)">
    <text x="600" y="168" text-anchor="middle" class="display-type" font-size="78" font-weight="900" fill="url(#name-grad)" letter-spacing="4.5">
      HEMANTH NAIDU
    </text>
  </g>

  <!-- Subtitle with Glowing Accent Chips -->
  <g filter="url(#name-shadow)">
    <text x="600" y="215" text-anchor="middle" class="display-type" font-size="20.5" font-weight="500" fill="#94a3b8" letter-spacing="1.2">
      Architecting <tspan fill="#00f2fe" font-weight="700">Local-First Systems</tspan> &#8226; <tspan fill="#3ddc84" font-weight="700">Android Specialist</tspan> &#8226; <tspan fill="#c084fc" font-weight="700">Full-Stack</tspan>
    </text>
  </g>

  <!-- Tactical Architecture Pill Dock -->
  <g transform="translate(195, 240)">
    <!-- Pill 1: 0ms Latency -->
    <g transform="translate(0, 0)">
      <rect width="190" height="30" rx="15" fill="#090d16" fill-opacity="0.85" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="95" y="19.5" text-anchor="middle" class="mono-type" font-size="11.5" font-weight="600" fill="#00f2fe" letter-spacing="1">⚡ 0ms ZERO-LATENCY</text>
    </g>
    <!-- Pill 2: Sovereign Storage -->
    <g transform="translate(206, 0)">
      <rect width="198" height="30" rx="15" fill="#090d16" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.2" />
      <text x="99" y="19.5" text-anchor="middle" class="mono-type" font-size="11.5" font-weight="600" fill="#c7d2fe" letter-spacing="1">🛡️ CLIENT SOVEREIGNTY</text>
    </g>
    <!-- Pill 3: Android Engine -->
    <g transform="translate(420, 0)">
      <rect width="190" height="30" rx="15" fill="#090d16" fill-opacity="0.85" stroke="#3ddc84" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="95" y="19.5" text-anchor="middle" class="mono-type" font-size="11.5" font-weight="600" fill="#4ade80" letter-spacing="1">📱 ANDROID RUNTIME</text>
    </g>
    <!-- Pill 4: Production Shipped -->
    <g transform="translate(626, 0)">
      <rect width="184" height="30" rx="15" fill="#090d16" fill-opacity="0.85" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="92" y="19.5" text-anchor="middle" class="mono-type" font-size="11.5" font-weight="600" fill="#f472b6" letter-spacing="1">🔥 PRODUCTION READY</text>
    </g>
  </g>

  <!-- Multi-Layered Cybernetic Waving Horizon -->
  <!-- Layer 1: Ambient Under-wave -->
  <path d="M 0 325 C 220 290, 480 365, 740 315 C 930 280, 1080 330, 1200 300 L 1200 370 L 0 370 Z" fill="url(#wave-grad-1)" />

  <!-- Layer 2: Main Foreground Wave -->
  <path d="M 0 340 C 280 360, 530 295, 820 335 C 990 358, 1110 318, 1200 330 L 1200 370 L 0 370 Z" fill="url(#wave-grad-2)" />

  <!-- Layer 3: Neon Laser Crest / Horizon line -->
  <path d="M 0 340 C 280 360, 530 295, 820 335 C 990 358, 1110 318, 1200 330" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.9" filter="url(#laser-glow)" />
</svg>