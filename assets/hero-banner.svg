<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a" />
      <stop offset="35%" stop-color="#0a0d14" />
      <stop offset="70%" stop-color="#120e29" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="glow-violet" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-magenta" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="badge-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Bottom Wave Gradients -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#7928ca" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="25%" stop-color="#1a103c" />
      <stop offset="55%" stop-color="#6c5ce7" />
      <stop offset="85%" stop-color="#00cec9" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="name-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.06" />
      <circle cx="40" cy="0" r="1" fill="#00f2fe" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    @keyframes subtle-shimmer {
      0% { opacity: 0.85; }
      50% { opacity: 1; }
      100% { opacity: 0.85; }
    }
    .pulse-beacon { animation: pulse-dot 2.2s infinite ease-in-out; transform-origin: center; }
    .mono-type { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .display-type { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />
  <rect width="1200" height="360" fill="url(#cyber-grid)" />

  <!-- Ambient Light blooms -->
  <circle cx="280" cy="140" r="300" fill="url(#glow-violet)" />
  <circle cx="920" cy="120" r="320" fill="url(#glow-cyan)" />
  <circle cx="600" cy="270" r="220" fill="url(#glow-magenta)" />

  <!-- Corner Circuit Accents & Bracket Geometry -->
  <g stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <!-- Top-Left -->
    <path d="M 32 50 L 32 32 L 50 32" />
    <circle cx="32" cy="32" r="2.5" fill="#00f2fe" />
    <line x1="58" y1="32" x2="120" y2="32" stroke="#00f2fe" stroke-opacity="0.2" stroke-dasharray="3 3" />

    <!-- Top-Right -->
    <path d="M 1168 50 L 1168 32 L 1150 32" />
    <circle cx="1168" cy="32" r="2.5" fill="#00f2fe" />
    <line x1="1142" y1="32" x2="1080" y2="32" stroke="#00f2fe" stroke-opacity="0.2" stroke-dasharray="3 3" />
  </g>

  <!-- Top Metadata HUD Displays -->
  <text x="56" y="42" class="mono-type" font-size="11" fill="#00f2fe" fill-opacity="0.75" letter-spacing="2">
    ARCHITECT // 0xHEMANTH • LOCAL_FIRST_CORE
  </text>
  <text x="1144" y="42" text-anchor="end" class="mono-type" font-size="11" fill="#10b981" fill-opacity="0.85" letter-spacing="2">
    ● 100% CLIENT-SIDE • ZERO TELEMETRY
  </text>

  <!-- High-Tech Central Status Badge -->
  <g transform="translate(390, 52)">
    <rect x="0" y="0" width="420" height="34" rx="17" fill="#0c1017" fill-opacity="0.85" stroke="url(#badge-border-grad)" stroke-width="1.3" filter="url(#neon-glow)" />
    <!-- Pulsing Live Dot -->
    <circle cx="26" cy="17" r="5" fill="#00f2fe" class="pulse-beacon" />
    <circle cx="26" cy="17" r="9" fill="none" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <text x="46" y="21.5" class="mono-type" font-size="12" font-weight="700" fill="#f1f5f9" letter-spacing="2">
      STATUS: <tspan fill="#00f2fe">LOCKED IN</tspan> • <tspan fill="#10b981">DEPLOYED</tspan>
    </text>
  </g>

  <!-- Main Hero Title -->
  <g filter="url(#name-shadow)">
    <text x="600" y="168" text-anchor="middle" class="display-type" font-size="76" font-weight="900" fill="url(#name-grad)" letter-spacing="4">
      HEMANTH NAIDU
    </text>
  </g>

  <!-- Subtitle with Glowing Accent Chips -->
  <g filter="url(#name-shadow)">
    <text x="600" y="214" text-anchor="middle" class="display-type" font-size="20.5" font-weight="500" fill="#94a3b8" letter-spacing="1.2">
      Architecting <tspan fill="#00f2fe" font-weight="700">Local-First Systems</tspan> &#8226; <tspan fill="#3ddc84" font-weight="700">Android Specialist</tspan> &#8226; <tspan fill="#c084fc" font-weight="700">Full-Stack</tspan>
    </text>
  </g>

  <!-- Tactical Architecture Pill Dock -->
  <g transform="translate(200, 238)">
    <!-- Pill 1: 0ms Latency -->
    <g transform="translate(0, 0)">
      <rect width="186" height="30" rx="15" fill="#090d16" fill-opacity="0.8" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1.1" />
      <text x="93" y="19" text-anchor="middle" class="mono-type" font-size="11.5" font-weight="600" fill="#00f2fe" letter-spacing="1">⚡ 0ms ZERO-LATENCY</text>
    </g>
    <!-- Pill 2: Sovereign Storage -->
    <g transform="translate(204, 0)">
      <rect width="194" height="30" rx="15" fill="#090d16" fill-opacity="0.8" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.1" />
      <text x="97" y="19" text-anchor="middle" class="mono-type" font-size="11.5" font-weight="600" fill="#c7d2fe" letter-spacing="1">🛡️ CLIENT SOVEREIGNTY</text>
    </g>
    <!-- Pill 3: Android Engine -->
    <g transform="translate(416, 0)">
      <rect width="186" height="30" rx="15" fill="#090d16" fill-opacity="0.8" stroke="#3ddc84" stroke-opacity="0.35" stroke-width="1.1" />
      <text x="93" y="19" text-anchor="middle" class="mono-type" font-size="11.5" font-weight="600" fill="#4ade80" letter-spacing="1">📱 ANDROID RUNTIME</text>
    </g>
    <!-- Pill 4: Production Shipped -->
    <g transform="translate(620, 0)">
      <rect width="180" height="30" rx="15" fill="#090d16" fill-opacity="0.8" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.1" />
      <text x="90" y="19" text-anchor="middle" class="mono-type" font-size="11.5" font-weight="600" fill="#f472b6" letter-spacing="1">🔥 PRODUCTION READY</text>
    </g>
  </g>

  <!-- Multi-Layered Cybernetic Waving Horizon -->
  <!-- Layer 1: Ambient Under-wave -->
  <path d="M 0 315 C 220 280, 480 355, 740 305 C 930 270, 1080 320, 1200 290 L 1200 360 L 0 360 Z" fill="url(#wave-grad-1)" />

  <!-- Layer 2: Main Foreground Wave -->
  <path d="M 0 330 C 280 350, 530 285, 820 325 C 990 348, 1110 308, 1200 320 L 1200 360 L 0 360 Z" fill="url(#wave-grad-2)" />

  <!-- Layer 3: Neon Laser Crest / Horizon line -->
  <path d="M 0 330 C 280 350, 530 285, 820 325 C 990 348, 1110 308, 1200 320" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.9" filter="url(#laser-glow)" />
</svg>