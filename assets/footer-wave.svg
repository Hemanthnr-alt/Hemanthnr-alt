<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="foot-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <linearGradient id="foot-fiber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#6c5ce7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <radialGradient id="foot-glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0" />
    </radialGradient>

    <filter id="foot-laser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="foot-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#00f2fe" fill-opacity="0.18" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-beacon { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes eq-foot { 0%, 100% { height: 14px; y: 4px; } 50% { height: 4px; y: 14px; } }
    .pulse-dot { animation: pulse-beacon 1.8s infinite ease-in-out; }
    .eq-f1 { animation: eq-foot 1.2s infinite ease-in-out; }
    .eq-f2 { animation: eq-foot 1.5s infinite ease-in-out 0.2s; }
    .eq-f3 { animation: eq-foot 1.1s infinite ease-in-out 0.4s; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Chassis Frame -->
  <rect x="2" y="2" width="1196" height="176" rx="18" fill="url(#foot-chassis)" stroke="url(#foot-fiber)" stroke-width="1.6" />
  <rect x="2" y="2" width="1196" height="176" rx="18" fill="url(#foot-dots)" />
  <circle cx="600" cy="90" r="240" fill="url(#foot-glow-c)" />

  <!-- Top Laser Trim -->
  <line x1="28" y1="8" x2="1172" y2="8" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.75" filter="url(#foot-laser)" />

  <!-- Central De-Auth & Doctrine Console -->
  <g transform="translate(60, 36)">
    <rect width="1080" height="88" rx="14" fill="#090e18" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />

    <!-- Left Audio EQ Waveform -->
    <g transform="translate(24, 32)">
      <rect x="0" width="3.5" rx="1.7" fill="#00f2fe" class="eq-f1" />
      <rect x="7" width="3.5" rx="1.7" fill="#38bdf8" class="eq-f2" />
      <rect x="14" width="3.5" rx="1.7" fill="#a855f7" class="eq-f3" />
    </g>

    <!-- Main Doctrine Statement -->
    <text x="60" y="42" class="mono" font-size="14.5" font-weight="700" fill="#f8fafc" letter-spacing="1">
      &gt;_ &quot;Master the 1% standard &#8212; building at the intersection of productivity, systems &amp; performance.&quot;
    </text>
    <text x="60" y="66" class="mono" font-size="11" fill="#64748b" letter-spacing="1.5">
      HEMANTH NAIDU // 100% OFFLINE-SOVEREIGN ARCHITECTURE &#8226; ZERO COMPROMISE
    </text>

    <!-- Right Live Status Stamp -->
    <g transform="translate(900, 28)">
      <rect width="156" height="32" rx="16" fill="#0c1e14" stroke="#10b981" stroke-width="1.2" />
      <circle cx="20" cy="16" r="4.5" fill="#10b981" class="pulse-dot" />
      <text x="34" y="20.5" class="mono" font-size="11.5" font-weight="800" fill="#34d399" letter-spacing="1">LOCKED IN</text>
    </g>
  </g>

  <!-- Bottom Coordinates Decal -->
  <text x="600" y="152" text-anchor="middle" class="mono" font-size="10" fill="#475569" letter-spacing="2">
    OPERATOR: 0xHEMANTH &#8226; SHA_256: LOCAL_FIRST_KERNEL &#8226; BANGALORE_IN &#8226; SESSION: PERSISTENT
  </text>
</svg>