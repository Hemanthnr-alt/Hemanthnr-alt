<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#090d15" />
      <stop offset="100%" stop-color="#0c091f" />
    </linearGradient>

    <radialGradient id="footer-cyan" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="footer-violet" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="footer-wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="footer-wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#00cec9" />
      <stop offset="65%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#090d14" />
    </linearGradient>

    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="140" fill="url(#footer-bg)" />
  <circle cx="200" cy="70" r="140" fill="url(#footer-violet)" />
  <circle cx="950" cy="70" r="150" fill="url(#footer-cyan)" />

  <!-- Wave 1: Under-crest -->
  <path d="M 0 45 C 240 85, 520 15, 780 65 C 960 95, 1100 45, 1200 70 L 1200 0 L 0 0 Z" fill="url(#footer-wave-1)" />

  <!-- Wave 2: Foreground Wave -->
  <path d="M 0 30 C 260 65, 510 5, 800 50 C 980 80, 1120 30, 1200 55 L 1200 0 L 0 0 Z" fill="url(#footer-wave-2)" />

  <!-- Laser Crest Line -->
  <path d="M 0 30 C 260 65, 510 5, 800 50 C 980 80, 1120 30, 1200 55" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.9" filter="url(#laser-glow)" />

  <!-- Subtitle Quote in center -->
  <text x="600" y="105" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#64748b" letter-spacing="2">
    &gt; HEMANTH NAIDU // LOCAL-FIRST SOVEREIGNTY &#8226; BUILT WITH DISCIPLINE
  </text>
</svg>