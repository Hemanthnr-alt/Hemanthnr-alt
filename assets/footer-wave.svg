<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="foot-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="40%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#0b071e" />
    </linearGradient>

    <!-- Radial Blooms -->
    <radialGradient id="foot-cyan" cx="85%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="foot-violet" cx="15%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Waves Gradients -->
    <linearGradient id="foot-wave-back" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="foot-wave-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#00cec9" />
      <stop offset="65%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <filter id="foot-laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b1" />
      <feGaussianBlur stdDeviation="3.5" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="foot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.05" />
      <circle cx="32" cy="0" r="0.8" fill="#00f2fe" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes foot-twinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
    @keyframes foot-laser { 0%, 100% { stroke-opacity: 0.95; } 50% { stroke-opacity: 0.65; } }
    @keyframes eq-a { 0%, 100% { height: 14px; y: 4px; } 50% { height: 4px; y: 14px; } }
    @keyframes eq-b { 0%, 100% { height: 6px; y: 12px; } 50% { height: 18px; y: 0px; } }
    @keyframes eq-c { 0%, 100% { height: 16px; y: 2px; } 50% { height: 8px; y: 10px; } }

    .twinkle { animation: foot-twinkle 2.5s infinite ease-in-out; }
    .foot-laser { animation: foot-laser 2.8s infinite ease-in-out; }
    .eq-1 { animation: eq-a 1.2s infinite ease-in-out; }
    .eq-2 { animation: eq-b 1.4s infinite ease-in-out; }
    .eq-3 { animation: eq-c 1.1s infinite ease-in-out; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="180" fill="url(#foot-canvas)" />
  <rect width="1200" height="180" fill="url(#foot-grid)" />

  <!-- Ambient Light Blooms -->
  <circle cx="160" cy="90" r="180" fill="url(#foot-violet)" />
  <circle cx="1020" cy="90" r="190" fill="url(#foot-cyan)" />

  <!-- Twinkling Star Points -->
  <circle cx="120" cy="130" r="1.5" fill="#00f2fe" class="twinkle" />
  <circle cx="310" cy="140" r="1.2" fill="#c084fc" class="twinkle" />
  <circle cx="890" cy="120" r="1.6" fill="#00f2fe" class="twinkle" />
  <circle cx="1080" cy="135" r="1.4" fill="#38bdf8" class="twinkle" />

  <!-- Inverted Top Cyber Wave (Wave 1: Ambient under-wave) -->
  <path d="M 0 55 C 240 105, 520 22, 780 82 C 960 118, 1100 55, 1200 88 L 1200 0 L 0 0 Z" fill="url(#foot-wave-back)" />

  <!-- Wave 2: Foreground Wave -->
  <path d="M 0 38 C 260 82, 510 12, 800 68 C 980 102, 1120 38, 1200 72 L 1200 0 L 0 0 Z" fill="url(#foot-wave-front)" />

  <!-- Laser Crest Line with Filter -->
  <path d="M 0 38 C 260 82, 510 12, 800 68 C 980 102, 1120 38, 1200 72" fill="none" stroke="#00f2fe" stroke-width="3.5" class="foot-laser" filter="url(#foot-laser-glow)" />

  <!-- Terminal Quote Enclosure Box -->
  <g transform="translate(150, 95)">
    <rect width="900" height="46" rx="12" fill="#060912" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.4" />

    <!-- Left Mini EQ Audio Visualizer -->
    <g transform="translate(20, 14)">
      <rect x="0" width="3" rx="1.5" fill="#00f2fe" class="eq-1" />
      <rect x="6" width="3" rx="1.5" fill="#38bdf8" class="eq-2" />
      <rect x="12" width="3" rx="1.5" fill="#a855f7" class="eq-3" />
    </g>

    <!-- Quote Content -->
    <text x="48" y="28" class="mono" font-size="12.5" font-weight="700" fill="#e2e8f0" letter-spacing="1.2">
      &gt;_ HEMANTH NAIDU // LOCAL-FIRST SOVEREIGNTY &#8226; BUILT WITH DISCIPLINE
    </text>

    <!-- Right Status Indicator Pill -->
    <g transform="translate(760, 10)">
      <rect width="120" height="26" rx="13" fill="#0c1e14" stroke="#10b981" stroke-width="1" />
      <circle cx="16" cy="13" r="4" fill="#10b981" class="twinkle" />
      <text x="28" y="17" class="mono" font-size="10.5" font-weight="800" fill="#34d399">0xLOCKED_IN</text>
    </g>
  </g>

  <!-- Bottom Global Technical Coordinates Decal -->
  <text x="600" y="165" text-anchor="middle" class="mono" font-size="9.5" fill="#475569" letter-spacing="2.5">
    NODE: BANGALORE_IN &#8226; LATENCY: &lt;1ms &#8226; ENCRYPTION: 256-BIT AES-GCM &#8226; CLIENT SOVEREIGN
  </text>
</svg>