<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="foot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="40%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0a081e" />
    </linearGradient>

    <radialGradient id="foot-cyan" cx="85%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="foot-violet" cx="15%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="foot-wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="foot-wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#00cec9" />
      <stop offset="65%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <filter id="foot-laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="foot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    @keyframes foot-twinkle {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.2; }
    }
    @keyframes foot-laser {
      0%, 100% { stroke-opacity: 0.95; }
      50% { stroke-opacity: 0.65; }
    }
    .twinkle { animation: foot-twinkle 2.5s infinite ease-in-out; }
    .foot-laser { animation: foot-laser 3s infinite ease-in-out; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="160" fill="url(#foot-bg)" />
  <rect width="1200" height="160" fill="url(#foot-grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="80" r="160" fill="url(#foot-violet)" />
  <circle cx="980" cy="80" r="170" fill="url(#foot-cyan)" />

  <!-- Twinkling Micro Stars -->
  <circle cx="140" cy="115" r="1.5" fill="#00f2fe" class="twinkle" />
  <circle cx="340" cy="125" r="1.2" fill="#c084fc" class="twinkle" />
  <circle cx="880" cy="110" r="1.6" fill="#00f2fe" class="twinkle" />
  <circle cx="1060" cy="120" r="1.4" fill="#38bdf8" class="twinkle" />

  <!-- Inverted Top Cyber Wave (Wave 1: Ambient under-wave) -->
  <path d="M 0 50 C 240 95, 520 20, 780 75 C 960 108, 1100 50, 1200 80 L 1200 0 L 0 0 Z" fill="url(#foot-wave-1)" />

  <!-- Wave 2: Foreground Wave -->
  <path d="M 0 35 C 260 75, 510 10, 800 60 C 980 92, 1120 35, 1200 65 L 1200 0 L 0 0 Z" fill="url(#foot-wave-2)" />

  <!-- Laser Crest Line -->
  <path d="M 0 35 C 260 75, 510 10, 800 60 C 980 92, 1120 35, 1200 65" fill="none" stroke="#00f2fe" stroke-width="3" class="foot-laser" filter="url(#foot-laser-glow)" />

  <!-- Terminal Quote Container Box -->
  <g transform="translate(180, 88)">
    <rect width="840" height="42" rx="10" fill="#070a12" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <!-- Pulse LED -->
    <circle cx="24" cy="21" r="4.5" fill="#00f2fe" class="twinkle" />
    <text x="42" y="26" class="mono" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="1.2">
      &gt;_ HEMANTH NAIDU // LOCAL-FIRST SOVEREIGNTY &#8226; BUILT WITH DISCIPLINE
    </text>
    <text x="815" y="26" text-anchor="end" class="mono" font-size="10.5" fill="#10b981" font-weight="700">
      [0xLOCKED_IN]
    </text>
  </g>

  <!-- Bottom Coordinates Decal -->
  <text x="600" y="148" text-anchor="middle" class="mono" font-size="9" fill="#475569" letter-spacing="2">
    NODE: BANGALORE_IN &#8226; SHA_256: 0xLOCAL_FIRST &#8226; ZERO-CLOUD COMPUTATION DIRECTIVE
  </text>
</svg>