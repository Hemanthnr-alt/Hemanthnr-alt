    <linearGradient id="nikaFooterBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3c50"/>
      <stop offset="50%" stop-color="#f0233c"/>
      <stop offset="100%" stop-color="#ff3c50"/>
