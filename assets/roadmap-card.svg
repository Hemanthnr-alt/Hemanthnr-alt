  <text x="36" y="144" fill="#cbd5e1" font-size="11" class="sans">8 unified pillars</text>
  <text x="36" y="160" fill="#cbd5e1" font-size="11" class="sans">100% offline SQLite</text>

  <!-- Phase 2 -->
  <rect x="224" y="58" width="186" height="136" rx="10" fill="url(#roadCard)" stroke="#310a3d" stroke-width="1"/>
  <rect x="236" y="70" width="80" height="18" rx="9" fill="#13231b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="246" y="83" fill="#22c55e" font-size="9.5" class="mono bold">COMPLETED</text>
  <text x="236" y="108" fill="#ffffff" font-size="13" class="sans bold">LockIn Fitness</text>
  <text x="236" y="128" fill="#cbd5e1" font-size="11" class="sans">30-day training splits</text>
  <text x="236" y="144" fill="#cbd5e1" font-size="11" class="sans">Audio rest timers</text>
  <text x="236" y="160" fill="#cbd5e1" font-size="11" class="sans">Discipline heatmaps</text>

  <!-- Phase 3 -->
