  <rect x="436" y="70" width="86" height="18" rx="9" fill="#250716" stroke="#ff3c50" stroke-width="0.8"/>
  <text x="445" y="83" fill="#ff6579" font-size="9.5" class="mono bold">IN PROGRESS</text>
  <text x="436" y="108" fill="#ff8093" font-size="13" class="sans bold">On-Device NLP</text>
