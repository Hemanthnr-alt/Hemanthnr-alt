  <text x="36" y="160" fill="#8b949e" font-size="11" class="sans">100% offline SQLite</text>

  <!-- Phase 2 -->
  <rect x="224" y="58" width="186" height="136" rx="10" fill="url(#roadCard)" stroke="#232e3f" stroke-width="1"/>
