<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="100%">
  <defs>
    <linearGradient id="roadBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0233c"/>
      <stop offset="25%" stop-color="#ff3c50"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ff3c50"/>
      <stop offset="100%" stop-color="#f0233c"/>
    </linearGradient>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07020d"/>
      <stop offset="50%" stop-color="#110418"/>
