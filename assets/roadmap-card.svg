  <rect x="436" y="70" width="86" height="18" rx="9" fill="#13222a" stroke="#00f2fe" stroke-width="0.8"/>
  <text x="445" y="83" fill="#00f2fe" font-size="9.5" class="mono bold">IN PROGRESS</text>
  <text x="436" y="108" fill="#00f2fe" font-size="13" class="sans bold">On-Device NLP</text>
