<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 38" width="162" height="38">
  <defs>
    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3c50"/>
      <stop offset="50%" stop-color="#f0233c"/>
      <stop offset="100%" stop-color="#ff6579"/>
    </linearGradient>
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190d1e"/>
      <stop offset="100%" stop-color="#0c0610"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .bold { font-weight: 700; }
  </style>

  <!-- Button Box -->
  <rect x="1" y="1" width="160" height="36" rx="8" fill="url(#btnBg)" stroke="url(#btnBorder)" stroke-width="1.2"/>
  <!-- Top Accent Indicator -->
  <line x1="12" y1="1" x2="38" y2="1" stroke="#ff3c50" stroke-width="2" stroke-linecap="round"/>

  <!-- Icon Area -->
  <g transform="translate(10, 9)">
    <circle cx="9" cy="9" r="7.5" fill="none" stroke="#ff4d66" stroke-width="1.2"/>
<circle cx="9" cy="9" r="4.2" fill="none" stroke="#ff3c50" stroke-width="1.1"/>
<circle cx="9" cy="9" r="1.8" fill="#ff4d66"/>
<path d="M9 1.5 L9 3.5 M9 14.5 L9 16.5 M1.5 9 L3.5 9 M14.5 9 L16.5 9" stroke="#ff4d66" stroke-width="1.1"/>
<path d="M9 9 L14 4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="36" y="17" fill="#ffffff" font-size="9.8" class="sans bold" letter-spacing="0.2">VISITORS</text>
  <text x="36" y="28" fill="#ff99a8" font-size="8.2" class="mono">260+ Verified</text>
