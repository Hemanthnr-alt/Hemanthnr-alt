<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <radialGradient id="roomField" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="90%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#030c14"/>
  <rect width="1200" height="380" rx="16" fill="url(#roomField)"/>

  <!-- Spherical "ROOM" Forcefield Rings -->
  <g transform="translate(960, 190)" opacity="0.65">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,8"/>
    <ellipse cx="0" cy="0" rx="40" ry="140" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,8"/>
    
    <!-- Heart Pirates Smiling Jolly Roger in Center -->
    <circle cx="0" cy="0" r="38" fill="#facc15" stroke="#000" stroke-width="3"/>
    <!-- Smiling eyes and mouth -->
    <path d="M -18,-6 Q -12,-14 -6,-6" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <path d="M 6,-6 Q 12,-14 18,-6" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <path d="M -18,10 Q 0,22 18,10" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Outer radiating marks -->
    <line x1="-48" y1="0" x2="-38" y2="0" stroke="#facc15" stroke-width="4"/>
    <line x1="38" y1="0" x2="48" y2="0" stroke="#facc15" stroke-width="4"/>
    <line x1="0" y1="-48" x2="0" y2="-38" stroke="#facc15" stroke-width="4"/>
    <line x1="0" y1="38" x2="0" y2="48" stroke="#facc15" stroke-width="4"/>
  </g>

  <!-- Surgical Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Japanese Kanji & Main Titles -->
  <text x="70" y="80" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="4">ONE PIECE // OPE OPE NO MI // 死の外科医</text>
  <text x="70" y="145" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="2">&#8220;ROOM&#8221; SURGEON OF DEATH</text>
  <text x="70" y="185" fill="#bae6fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">Surgical Spatial Architecture &#8212; Shambles Refactoring at Zero Latency</text>

  <!-- Subtitle -->
  <text x="70" y="222" fill="#7dd3fc" font-family="'SF Mono', monospace" font-size="13" font-weight="500">
    Hemanth &#8226; Heart Pirates Captain &#8226; Kotlin, TypeScript, Reactive Microservices
  </text>

  <!-- Metric Badges -->
  <g transform="translate(70, 260)">
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#082f49" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.5"/>
    <text x="16" y="17" fill="#7dd3fc" font-family="'SF Mono', monospace" font-size="9" font-weight="700">FORCEFIELD</text>
    <text x="16" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">ROOM: ACTIVE</text>

    <rect x="180" y="0" width="175" height="42" rx="10" fill="#082f49" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.5"/>
    <text x="196" y="17" fill="#7dd3fc" font-family="'SF Mono', monospace" font-size="9" font-weight="700">ROUTING ENGINE</text>
    <text x="196" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">SHAMBLES 0ms</text>

    <rect x="370" y="0" width="165" height="42" rx="10" fill="#082f49" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.5"/>
    <text x="386" y="17" fill="#7dd3fc" font-family="'SF Mono', monospace" font-size="9" font-weight="700">CODE REFACTOR</text>
    <text x="386" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">TACT DISSECTION</text>

    <rect x="550" y="0" width="165" height="42" rx="10" fill="#082f49" fill-opacity="0.8" stroke="#facc15" stroke-width="1.5"/>
    <text x="566" y="17" fill="#fef08a" font-family="'SF Mono', monospace" font-size="9" font-weight="700">CREW CREST</text>
    <text x="566" y="32" fill="#facc15" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">HEART PIRATES</text>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#lawBorder)" stroke-width="2"/>
</svg>