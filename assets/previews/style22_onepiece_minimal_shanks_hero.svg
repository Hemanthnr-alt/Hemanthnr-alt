<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <radialGradient id="shanksGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shanksBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#262626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#090505"/>
  <rect width="1200" height="380" rx="16" fill="url(#shanksGlow)"/>

  <!-- Minimal Triple Scar Slash Motif (Iconic 3 Scarlet Hairlines) -->
  <g transform="translate(960, 190)" opacity="0.85">
    <!-- Subtle Saber Gryphon Silhouette (Clean outline) -->
    <line x1="-120" y1="60" x2="120" y2="-60" stroke="#f8fafc" stroke-width="1.5" opacity="0.3"/>
    
    <!-- 3 Sharp Diagonal Scars -->
    <line x1="-32" y1="-80" x2="16" y2="80" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="-85" x2="36" y2="75" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="8" y1="-80" x2="56" y2="80" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Subtle Straw Hat Floating Above -->
    <g transform="translate(0, -95) scale(0.65)">
      <path d="M -24,-10 C -24,-30 24,-30 24,-10 Z" fill="#090505" stroke="#f59e0b" stroke-width="3"/>
      <path d="M -24,-10 C -24,-16 24,-16 24,-10 Z" fill="#ef4444"/>
      <path d="M -44,-8 Q 0,-20 44,-8 Q 0,-14 -44,-8 Z" fill="#f59e0b"/>
    </g>

    <text x="12" y="110" text-anchor="middle" fill="#ef4444" font-family="'SF Mono', monospace" font-size="9" letter-spacing="3" opacity="0.8">
      THE PROMISE &#8226; 赤髪
    </text>
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 0)">
    <text x="0" y="78" fill="#ef4444" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="4" opacity="0.9">
      RED HAIR COVENANT // 赤髪海賊団
    </text>

    <text x="0" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">
      Hemanth
    </text>

    <text x="0" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="400">
      Minimalist Engineering with Unyielding Focus &amp; Impact
    </text>

    <text x="0" y="214" fill="#cbd5e1" font-family="'SF Mono', monospace" font-size="12" font-weight="500" letter-spacing="1">
      TypeScript &#8226; Kotlin &#8226; Clean Systems &#8226; High Reliability
    </text>

    <!-- Minimalist Badges -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="145" height="38" rx="8" fill="#18181b" fill-opacity="0.8" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="15" fill="#71717a" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">HAKI TIER</text>
      <text x="14" y="29" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CONQUEROR</text>

      <rect x="157" y="0" width="145" height="38" rx="8" fill="#18181b" fill-opacity="0.8" stroke="#27272a" stroke-width="1"/>
      <text x="171" y="15" fill="#71717a" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">PACT</text>
      <text x="171" y="29" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">PASS THE HAT</text>

      <rect x="314" y="0" width="145" height="38" rx="8" fill="#18181b" fill-opacity="0.8" stroke="#27272a" stroke-width="1"/>
      <text x="328" y="15" fill="#71717a" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">REASONING</text>
      <text x="328" y="29" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">FIRST PRINCIPLES</text>

      <rect x="471" y="0" width="155" height="38" rx="8" fill="#18181b" fill-opacity="0.8" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
      <text x="485" y="15" fill="#ef4444" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">FUTURE SIGHT</text>
      <text x="485" y="29" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">10 SECONDS</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#shanksBorder)" stroke-width="1.2"/>
</svg>