<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="iso-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="iso-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="iso-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="iso-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#iso-bg)" />

  <!-- 3D Isometric Floating Monolith Cubes (Tech Pillars) -->
  <g transform="translate(600, 160)">
    <!-- Center Island Base Top -->
    <polygon points="0,-70 120,-10 0,50 -120,-10" fill="url(#iso-top)" stroke="#00f2fe" stroke-width="1.5" />
    <!-- Left Side -->
    <polygon points="-120,-10 0,50 0,110 -120,50" fill="url(#iso-left)" stroke="#00f2fe" stroke-width="1.5" />
    <!-- Right Side -->
    <polygon points="0,50 120,-10 120,50 0,110" fill="url(#iso-right)" stroke="#00f2fe" stroke-width="1.5" />
    
    <!-- Neon Data Waterfall pouring down -->
    <line x1="0" y1="110" x2="0" y2="200" stroke="#00f2fe" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />
  </g>

  <!-- Left Floating Cube: Android -->
  <g transform="translate(260, 200)">
    <polygon points="0,-40 60,-10 0,20 -60,-10" fill="#3ddc84" fill-opacity="0.8" stroke="#3ddc84" stroke-width="1" />
    <polygon points="-60,-10 0,20 0,60 -60,30" fill="#0f381e" />
    <polygon points="0,20 60,-10 60,30 0,60" fill="#1b5e20" />
    <text x="0" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3ddc84">ANDROID_CORE</text>
  </g>

  <!-- Right Floating Cube: SQLite -->
  <g transform="translate(940, 200)">
    <polygon points="0,-40 60,-10 0,20 -60,-10" fill="#00f2fe" fill-opacity="0.8" stroke="#00f2fe" stroke-width="1" />
    <polygon points="-60,-10 0,20 0,60 -60,30" fill="#042738" />
    <polygon points="0,20 60,-10 60,30 0,60" fill="#083a54" />
    <text x="0" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe">SQLITE_ENGINE</text>
  </g>

  <!-- Main Hero Title Above Floating Citadel -->
  <text x="600" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="4">
    HEMANTH NAIDU
  </text>
  <text x="600" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="2">
    ISOMETRIC ARCHITECTURE // LOCAL-FIRST SOVEREIGNTY
  </text>

  <!-- Bottom Floating Badges -->
  <g transform="translate(360, 360)">
    <rect width="480" height="34" rx="17" fill="#0b1329" stroke="#38bdf8" stroke-width="1.2" />
    <text x="240" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1">
      LATENCY: &lt;1ms &#8226; CLOUD: 0% &#8226; ANDROID NATIVE
    </text>
  </g>
</svg>