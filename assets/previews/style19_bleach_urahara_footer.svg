<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="uraharaFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080205"/>
      <stop offset="50%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#080205"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#uraharaFootGrad)"/>
  
  <!-- Swirling Cherry Petals Across Bottom -->
  <g fill="#fb7185" opacity="0.6">
    <circle cx="200" cy="80" r="3"/>
    <circle cx="350" cy="110" r="4"/>
    <circle cx="500" cy="60" r="3.5"/>
    <circle cx="700" cy="70" r="4"/>
    <circle cx="850" cy="120" r="3"/>
    <circle cx="1020" cy="90" r="4"/>
  </g>

  <!-- Center Fan Crest -->
  <g transform="translate(600, 48)">
    <path d="M -30,12 C -20,-10 20,-10 30,12 Z" fill="#10b981" stroke="#ecfdf5" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="3" fill="#f43f5e"/>
  </g>

  <text x="600" y="98" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
    &#8220;There is nothing, but nothing I wouldn&#8217;t do to prepare for victory. Master every layer.&#8221;
  </text>
  <text x="600" y="125" text-anchor="middle" fill="#fda4af" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="2">
    KISUKE URAHARA &amp; BYAKUYA KUCHIKI // SOUL SOCIETY WISDOM
  </text>

  <rect x="1" y="1" width="1198" height="158" rx="15" fill="none" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>