<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <radialGradient id="nikaGlow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nikaBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="380" rx="16" fill="#07090e"/>
  <rect width="1200" height="380" rx="16" fill="url(#nikaGlow)"/>

  <!-- Minimal Background Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.75">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
  </g>

  <!-- Minimalist Sun God Nika Solar Halo Disc & Floating Hagoromo Cloud Ribbon -->
  <g transform="translate(960, 190)">
    <!-- Thin Solar Halo Ring -->
    <circle cx="0" cy="0" r="125" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
    <circle cx="0" cy="0" r="100" fill="#07090e" stroke="#fef08a" stroke-width="0.75" stroke-dasharray="2,6" opacity="0.6"/>

    <!-- Minimal Gear 5 Flowing White Hagoromo Steam Ribbon -->
    <path d="M -90,40 C -120,-30 -30,-90 20,-80 C 80,-70 120,-10 90,50 C 70,85 20,95 -20,85 C -60,75 -75,90 -90,40 Z" fill="none" stroke="url(#cloudGrad)" stroke-width="2.5" opacity="0.85"/>
    <!-- Secondary inner floating steam puff -->
    <path d="M -50,-20 C -70,-60 10,-80 40,-50 C 70,-20 30,20 -10,10 C -30,0 -40,-10 -50,-20 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5"/>

    <!-- Center: Minimalist Straw Hat Icon (The Anchor of Nika) -->
    <g transform="translate(0, 0)">
      <!-- Straw Hat Crown -->
      <path d="M -22,-6 C -22,-24 22,-24 22,-6 Z" fill="#07090e" stroke="#f59e0b" stroke-width="2"/>
      <!-- Red Ribbon -->
      <path d="M -22,-6 C -22,-12 22,-12 22,-6 Z" fill="#ef4444"/>
      <!-- Straw Hat Brim -->
      <path d="M -40,-4 Q 0,-14 40,-4 Q 0,-9 -40,-4 Z" fill="#f59e0b"/>
    </g>

    <!-- Drums of Liberation Soundwave Telemetry Line -->
    <g transform="translate(0, 100)" opacity="0.8">
      <path d="M -90,0 L -50,0 L -40,-8 L -30,8 L -20,-12 L -10,12 L 0,0 L 40,0 L 50,-8 L 60,8 L 70,0 L 90,0" fill="none" stroke="#fef08a" stroke-width="1.2"/>
      <text x="0" y="22" text-anchor="middle" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="8.5" letter-spacing="3">
        *DOOM DUT DA DA* &#8226; LIBERATION
      </text>
    </g>
  </g>

  <!-- Left Content: Swiss Minimalist Layout -->
  <g transform="translate(80, 0)">
    <!-- Category Tag -->
    <text x="0" y="78" fill="#fef08a" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="4" opacity="0.9">
      MONKEY D. LUFFY // 太陽の神ニカ // GEAR 5
    </text>

    <!-- Main Title -->
    <text x="0" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">
      Hemanth
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="400">
      Warrior of Liberation &#8212; Building Software with Unbounded Freedom
    </text>

    <!-- Tech Stack -->
    <text x="0" y="214" fill="#cbd5e1" font-family="'SF Mono', monospace" font-size="12" font-weight="500" letter-spacing="1">
      TypeScript &#8226; Kotlin &#8226; Reactive Systems &#8226; High-Velocity Shipping
    </text>

    <!-- Minimalist Badges -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="145" height="38" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="14" y="15" fill="#64748b" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">HEARTBEAT</text>
      <text x="14" y="29" fill="#fef08a" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">DRUMS OF LIB</text>

      <rect x="157" y="0" width="145" height="38" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="171" y="15" fill="#64748b" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">TRANSFORMATION</text>
      <text x="171" y="29" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">PEAK: GEAR 5</text>

      <rect x="314" y="0" width="145" height="38" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="328" y="15" fill="#64748b" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">CODE VELOCITY</text>
      <text x="328" y="29" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">UNBOUNDED</text>

      <rect x="471" y="0" width="155" height="38" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="485" y="15" fill="#f8fafc" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5">STATUS</text>
      <text x="485" y="29" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">LAUGHING &amp; FREE</text>
    </g>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#nikaBorder)" stroke-width="1.2"/>
</svg>