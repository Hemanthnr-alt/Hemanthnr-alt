<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="mecha-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a" />
      <stop offset="50%" stop-color="#0a0814" />
      <stop offset="100%" stop-color="#08040d" />
    </linearGradient>

    <!-- Honeycomb Pattern -->
    <pattern id="hex-grid" width="28" height="48" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M 14 0 L 28 8 L 28 24 L 14 32 L 0 24 L 0 8 Z" fill="none" stroke="#ff0055" stroke-width="0.6" stroke-opacity="0.12" />
      <path d="M 14 32 L 28 40 L 28 56 L 14 64 L 0 56 L 0 40 Z" fill="none" stroke="#ff0055" stroke-width="0.6" stroke-opacity="0.12" />
    </pattern>

    <linearGradient id="mecha-red-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <filter id="mecha-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes reticle-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes warning-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .reticle { animation: reticle-spin 20s linear infinite; transform-origin: 600px 140px; }
    .warning { animation: warning-blink 1.5s infinite ease-in-out; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Base -->
  <rect width="1200" height="420" fill="url(#mecha-bg)" />
  <rect width="1200" height="420" fill="url(#hex-grid)" />

  <!-- Diagonal Warning Hazard Stripes (Top and Bottom edges) -->
  <g fill="#ff0055" fill-opacity="0.18">
    <polygon points="0,0 20,0 0,20" /><polygon points="40,0 60,0 0,60 0,40" />
    <polygon points="80,0 100,0 0,100 0,80" /><polygon points="120,0 140,0 0,140 0,120" />
    <polygon points="1160,0 1200,0 1200,40" /><polygon points="1120,0 1140,0 1200,80 1200,60" />
  </g>

  <!-- Targeting Reticle System (Center) -->
  <circle cx="600" cy="140" r="110" fill="none" stroke="#ff0055" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="12 12" class="reticle" />
  <circle cx="600" cy="140" r="85" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="40 20" class="reticle" style="animation-direction: reverse; animation-duration: 14s;" />
  <circle cx="600" cy="140" r="4" fill="#ff0055" />

  <!-- Top Decal Header -->
  <g transform="translate(60, 32)">
    <text x="0" y="10" class="mono" font-size="11" font-weight="700" fill="#ff0055" letter-spacing="2">
      MECHA_UNIT: 0xHEMANTH // PILOT_SYNC: 100%
    </text>
    <g transform="translate(940, 0)">
      <rect width="140" height="20" rx="4" fill="#26040e" stroke="#ff0055" stroke-width="1" />
      <circle cx="12" cy="10" r="3.5" fill="#ff0055" class="warning" />
      <text x="24" y="14" class="mono" font-size="9.5" font-weight="800" fill="#ff0055" letter-spacing="1">DEFENSE: ACTIVE</text>
    </g>
  </g>

  <!-- Japanese Katakana Super-Header -->
  <text x="600" y="110" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#ff0055" fill-opacity="0.8" letter-spacing="10">
    ヘマンツ &#8226; ナイヅ // ローカルファースト
  </text>

  <!-- Main Hero Title -->
  <g filter="url(#mecha-glow)">
    <text x="600" y="175" text-anchor="middle" class="display" font-size="82" font-weight="900" fill="url(#mecha-red-cyan)" letter-spacing="6">
      HEMANTH NAIDU
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" class="display" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="2">
    LOCAL-FIRST SYSTEMS ARCHITECT &#8226; <tspan fill="#ff0055">ANDROID CORE</tspan> &#8226; <tspan fill="#00f2fe">FULL-STACK</tspan>
  </text>

  <!-- 4 Angular Mecha Armor Capsules -->
  <g transform="translate(160, 268)">
    <polygon points="0,0 190,0 205,34 15,34" fill="#12040c" stroke="#ff0055" stroke-width="1.2" />
    <text x="100" y="22" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#ff0055">&#9889; 0ms ZERO-LATENCY</text>

    <g transform="translate(225, 0)">
      <polygon points="0,0 195,0 210,34 15,34" fill="#12040c" stroke="#00f2fe" stroke-width="1.2" />
      <text x="105" y="22" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#00f2fe">&#128737; SOVEREIGN CORE</text>
    </g>

    <g transform="translate(455, 0)">
      <polygon points="0,0 190,0 205,34 15,34" fill="#12040c" stroke="#3ddc84" stroke-width="1.2" />
      <text x="100" y="22" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#3ddc84">&#128241; ANDROID HARDWARE</text>
    </g>

    <g transform="translate(680, 0)">
      <polygon points="0,0 185,0 200,34 15,34" fill="#12040c" stroke="#fbbf24" stroke-width="1.2" />
      <text x="95" y="22" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#fbbf24">&#128293; PROD DEPLOYED</text>
    </g>
  </g>

  <!-- Bottom Crosshair Rail -->
  <line x1="60" y1="360" x2="1140" y2="360" stroke="#ff0055" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="8 8" />
  <text x="600" y="390" text-anchor="middle" class="mono" font-size="10" fill="#64748b" letter-spacing="2">
    EVA_SPEC: NERV_01 &#8226; AIR-GAPPED HARDWARE &#8226; TARGET: MASTER THE 1% STANDARD
  </text>
</svg>