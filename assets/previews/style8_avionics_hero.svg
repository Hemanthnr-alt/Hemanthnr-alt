<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="aero-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02080a" />
      <stop offset="100%" stop-color="#031217" />
    </linearGradient>
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
  </style>

  <rect width="1200" height="420" fill="url(#aero-bg)" />

  <!-- Avionics Grid & Pitch Ladder -->
  <g stroke="#00f2fe" stroke-opacity="0.2" stroke-width="0.8">
    <line x1="0" y1="210" x2="1200" y2="210" stroke-opacity="0.4" stroke-width="1.2" />
    <line x1="600" y1="0" x2="600" y2="420" stroke-opacity="0.4" stroke-width="1.2" />
    <!-- Altitude & Speed Tapes -->
    <line x1="120" y1="40" x2="120" y2="380" stroke-width="1.5" />
    <line x1="1080" y1="40" x2="1080" y2="380" stroke-width="1.5" />
    <!-- Pitch Bars -->
    <line x1="520" y1="130" x2="560" y2="130" /><line x1="640" y1="130" x2="680" y2="130" />
    <line x1="500" y1="290" x2="560" y2="290" /><line x1="640" y1="290" x2="700" y2="290" />
  </g>

  <!-- Top Compass Heading Tape -->
  <g transform="translate(420, 28)" class="mono" font-size="11" fill="#00f2fe" filter="url(#hud-glow)">
    <rect width="360" height="24" rx="4" fill="#041a20" stroke="#00f2fe" stroke-width="1" />
    <text x="180" y="16" text-anchor="middle" font-weight="700">HDG: 360&#176; NORTH // MACH 3.2 // ALT: 85,000 FT</text>
  </g>

  <!-- Left Speed Indicator Box -->
  <g transform="translate(40, 160)" class="mono" fill="#00f2fe" filter="url(#hud-glow)">
    <rect width="110" height="70" rx="4" fill="#041a20" stroke="#00f2fe" stroke-width="1.2" />
    <text x="14" y="24" font-size="10">AIRSPEED</text>
    <text x="14" y="52" font-size="24" font-weight="900">0.8ms</text>
  </g>

  <!-- Right Radar Box -->
  <g transform="translate(1050, 160)" class="mono" fill="#00f2fe" filter="url(#hud-glow)">
    <rect width="110" height="70" rx="4" fill="#041a20" stroke="#00f2fe" stroke-width="1.2" />
    <text x="14" y="24" font-size="10">STATUS</text>
    <text x="14" y="50" font-size="14" font-weight="800" fill="#34d399">LOCKED</text>
  </g>

  <!-- Center Flight Crosshair & Boresight Symbol -->
  <g transform="translate(600, 160)" stroke="#00f2fe" stroke-width="2" fill="none" filter="url(#hud-glow)">
    <circle cx="0" cy="0" r="14" />
    <line x1="-30" y1="0" x2="-14" y2="0" /><line x1="14" y1="0" x2="30" y2="0" />
    <line x1="0" y1="-30" x2="0" y2="-14" /><line x1="0" y1="14" x2="0" y2="30" />
  </g>

  <!-- Hero Flight Identifier Typography -->
  <g transform="translate(600, 230)" filter="url(#hud-glow)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="64" font-weight="900" fill="#00f2fe" letter-spacing="8">
      HEMANTH NAIDU
    </text>
    <text x="0" y="34" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#e2e8f0" letter-spacing="2">
      AVIONICS DIRECTIVE: LOCAL-FIRST SYSTEMS &#8226; ANDROID &#8226; FULL-STACK
    </text>
  </g>

  <!-- Bottom Weapon / Engine Status Pylons -->
  <g transform="translate(240, 310)" class="mono" font-size="11" fill="#00f2fe">
    <rect width="160" height="34" rx="4" fill="#041a20" stroke="#00f2fe" stroke-width="1" />
    <text x="80" y="22" text-anchor="middle">&#9670; ENGINE: SQLITE</text>

    <g transform="translate(180, 0)">
      <rect width="160" height="34" rx="4" fill="#041a20" stroke="#00f2fe" stroke-width="1" />
      <text x="80" y="22" text-anchor="middle">&#9670; SENSORS: 0% TEL</text>
    </g>

    <g transform="translate(360, 0)">
      <rect width="180" height="34" rx="4" fill="#041a20" stroke="#00f2fe" stroke-width="1" />
      <text x="90" y="22" text-anchor="middle">&#9670; AVIONICS: ANDROID</text>
    </g>

    <g transform="translate(560, 0)">
      <rect width="160" height="34" rx="4" fill="#041a20" stroke="#00f2fe" stroke-width="1" />
      <text x="80" y="22" text-anchor="middle">&#9670; MISSION: SHIPPED</text>
    </g>
  </g>
</svg>