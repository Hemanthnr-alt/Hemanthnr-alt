<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="fireFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0302"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#0a0302"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#fireFootGrad)"/>
  
  <!-- Wave of Flames across base -->
  <path d="M 0,160 Q 300,100 600,130 T 1200,90 L 1200,160 Z" fill="#ea580c" opacity="0.3"/>
  <path d="M 0,160 Q 400,120 750,145 T 1200,120 L 1200,160 Z" fill="#f59e0b" opacity="0.2"/>

  <!-- Flame Flame Crest -->
  <g transform="translate(600, 50)">
    <circle cx="0" cy="0" r="16" fill="#f97316"/>
    <path d="M -8,4 Q 0,-14 8,4 Z" fill="#fef08a"/>
  </g>

  <text x="600" y="98" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
    &#8220;Once we set sail on this sea, you face these waters alone! Live with no regrets!&#8221;
  </text>
  <text x="600" y="125" text-anchor="middle" fill="#fdba74" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="2">
    PORTGAS D. ACE &amp; SABO // THE FLAME WILL NEVER EXTINGUISH
  </text>

  <rect x="1" y="1" width="1198" height="158" rx="15" fill="none" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>