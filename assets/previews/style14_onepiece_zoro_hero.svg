<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <radialGradient id="zoroGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#021a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="enmaFire" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="enmaHaki" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="zoroBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="#020e0a"/>
  <rect width="1200" height="380" rx="16" fill="url(#zoroGlow)"/>
  <rect width="1200" height="380" rx="16" fill="url(#enmaFire)"/>

  <!-- Spectral Green Slash Rays (Santoryu) -->
  <g opacity="0.35">
    <polygon points="0,60 1200,280 1200,295 0,75" fill="#34d399"/>
    <polygon points="100,0 1150,380 1120,380 70,0" fill="#10b981"/>
    <polygon points="0,320 900,0 930,0 0,335" fill="#059669"/>
  </g>

  <!-- Spectral Enma Flame Auras (Right side dragon coil) -->
  <g opacity="0.25">
    <path d="M 850,280 Q 920,180 880,120 T 1000,60 T 1100,160 T 950,320 Z" fill="#10b981"/>
    <circle cx="950" cy="180" r="140" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="10,14" opacity="0.6"/>
    <circle cx="950" cy="180" r="100" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="6,8" opacity="0.4"/>
  </g>

  <!-- Three Crossed Katana Silhouette Motif (Santoryu) -->
  <g transform="translate(950, 180)" opacity="0.7">
    <!-- Wado Ichimonji (Horizontal / in mouth) -->
    <path d="M -160,0 L 160,0" stroke="#f0fdf4" stroke-width="3"/>
    <polygon points="160,-4 180,0 160,4" fill="#f0fdf4"/>
    <rect x="-140" y="-7" width="20" height="14" rx="2" fill="#d1fae5" stroke="#059669"/>
    <!-- Sandai Kitetsu (Diagonal left) -->
    <line x1="-120" y1="-120" x2="120" y2="120" stroke="#ef4444" stroke-width="3"/>
    <!-- Enma (Diagonal right with green aura) -->
    <line x1="-120" y1="120" x2="120" y2="-120" stroke="#34d399" stroke-width="4"/>
    <line x1="-120" y1="120" x2="120" y2="-120" stroke="#10b981" stroke-width="12" opacity="0.3"/>
    <!-- Center Haki burst -->
    <circle cx="0" cy="0" r="12" fill="#10b981" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="#ecfdf5"/>
  </g>

  <!-- Japanese Kanji Calligraphy & Title -->
  <text x="70" y="80" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="4" opacity="0.9">ONE PIECE // RORONOA ZORO // 閻魔三刀流</text>
  <text x="70" y="145" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="2">KING OF HELL</text>
  <text x="70" y="185" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">Santoryu Architect &#8212; Slicing Complexity with Absolute Precision</text>

  <!-- Developer Identity Subtitle -->
  <text x="70" y="222" fill="#6ee7b7" font-family="'SF Mono', 'Courier New', monospace" font-size="13" font-weight="500">
    Hemanth &#8226; Full-Stack Core Engineer &#8226; High-Performance Systems &amp; Mobile
  </text>

  <!-- Zoro / Santoryu Stat Pills -->
  <g transform="translate(70, 260)">
    <!-- Pill 1: Santoryu -->
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="17" fill="#6ee7b7" font-family="'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">STYLE</text>
    <text x="16" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">SANTORYU 3X</text>

    <!-- Pill 2: Enma Ryuo -->
    <rect x="180" y="0" width="175" height="42" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <text x="196" y="17" fill="#6ee7b7" font-family="'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">BLADE INFUSION</text>
    <text x="196" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">ENMA RYUO HAKI</text>

    <!-- Pill 3: Ashura Engine -->
    <rect x="370" y="0" width="165" height="42" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <text x="386" y="17" fill="#6ee7b7" font-family="'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">MULTI-CORE</text>
    <text x="386" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">ASHURA 9-BLADES</text>

    <!-- Pill 4: Code Status -->
    <rect x="550" y="0" width="165" height="42" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="1.5"/>
    <text x="566" y="17" fill="#6ee7b7" font-family="'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">ZERO DRIFT</text>
    <text x="566" y="32" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">CUT THROUGH ZERO</text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#zoroBorder)" stroke-width="2"/>
</svg>