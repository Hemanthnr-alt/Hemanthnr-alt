<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crt-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020803" />
      <stop offset="50%" stop-color="#041207" />
      <stop offset="100%" stop-color="#010603" />
    </linearGradient>
    <radialGradient id="crt-curve" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </radialGradient>
    <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="p" />
      <feMerge><feMergeNode in="p" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crt-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: crt-cursor 1s infinite; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <rect width="1200" height="400" fill="url(#crt-bg)" />
  <rect width="1200" height="400" fill="url(#crt-curve)" />

  <!-- CRT Terminal Bezel Frame -->
  <rect x="20" y="20" width="1160" height="360" rx="12" fill="none" stroke="#00ff66" stroke-width="1.6" stroke-opacity="0.4" filter="url(#phosphor)" />

  <!-- Terminal Header -->
  <g transform="translate(45, 52)" class="mono" font-size="11" fill="#00ff66">
    <text y="0">root@lockin-core:~# uname -a</text>
    <text y="20" fill="#34d399">Linux lockin-system 6.1.0-local-first #1 SMP PREEMPT_DYNAMIC x86_64 Android</text>
    <text y="44">root@lockin-core:~# ./launch_profile --operator="hemanth-naidu"</text>
  </g>

  <!-- Large ASCII/Pixel Identity Header -->
  <g transform="translate(600, 195)" filter="url(#phosphor)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="54" font-weight="900" fill="#00ff66" letter-spacing="6">
      [ HEMANTH NAIDU ]
    </text>
    <text x="0" y="36" text-anchor="middle" class="mono" font-size="14.5" fill="#34d399" letter-spacing="3">
      &lt;&lt; LOCAL-FIRST SYSTEMS ARCHITECT // ANDROID SPECIALIST &gt;&gt;
    </text>
  </g>

  <!-- Telemetry Dump Matrix -->
  <g transform="translate(180, 275)" class="mono" font-size="11" fill="#00ff66" filter="url(#phosphor)">
    <rect width="840" height="64" rx="6" fill="#020d04" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1" />
    <text x="24" y="26">STACK: [TypeScript, Kotlin, Dexie.js, SQLite, React, Capacitor 8, Node.js]</text>
    <text x="24" y="46">STATUS: <tspan fill="#34d399">100% AIR-GAPPED</tspan> | TELEMETRY: <tspan fill="#00ff66">0.00%</tspan> | LATENCY: <tspan fill="#34d399">&lt;0.8ms</tspan> | COMMITS: <tspan fill="#00ff66">320+</tspan><tspan fill="#00ff66" class="cursor"> _</tspan></text>
  </g>
</svg>