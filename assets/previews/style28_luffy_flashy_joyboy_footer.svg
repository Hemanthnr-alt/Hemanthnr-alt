<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="iriFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="rainbowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="33%" stop-color="#c084fc"/>
      <stop offset="66%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#iriFootGrad)"/>

  <!-- Rainbow Horizon Wave -->
  <path d="M 0,45 Q 300,25 600,45 T 1200,45" fill="none" stroke="url(#rainbowLine)" stroke-width="3"/>

  <g transform="translate(600, 45)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#facc15"/>
  </g>

  <text x="600" y="98" text-anchor="middle" fill="#ffffff" font-family="'Impact', sans-serif" font-size="18" letter-spacing="1">
    &#8220;AS LONG AS YOU SMILE, YOU HAVE UNLIMITED POWER!&#8221;
  </text>
  <text x="600" y="126" text-anchor="middle" fill="#c084fc" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="3">
    JOYBOY HAS RETURNED // LAUGHING THROUGH EVERY STORM
  </text>

  <rect x="2" y="2" width="1196" height="156" rx="15" fill="none" stroke="url(#rainbowLine)" stroke-opacity="0.7" stroke-width="1.5"/>
</svg>