<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="shanksFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090505"/>
      <stop offset="50%" stop-color="#1c0a0a"/>
      <stop offset="100%" stop-color="#090505"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#shanksFootGrad)"/>

  <!-- Minimal 3 Scar Cuts on Footer Line -->
  <line x1="80" y1="40" x2="1120" y2="40" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
  
  <g transform="translate(600, 40)">
    <line x1="-12" y1="-12" x2="0" y2="12" stroke="#ef4444" stroke-width="2"/>
    <line x1="-3" y1="-14" x2="9" y2="10" stroke="#ef4444" stroke-width="2"/>
    <line x1="6" y1="-12" x2="18" y2="12" stroke="#ef4444" stroke-width="2"/>
  </g>

  <text x="600" y="94" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="500">
    &#8220;By experiencing both victory and defeat, running about and shedding tears, a person becomes a true master.&#8221;
  </text>
  <text x="600" y="122" text-anchor="middle" fill="#71717a" font-family="'SF Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="2.5">
    RED HAIR SHANKS &#8226; CALM PRESENCE, ABSOLUTE AUTHORITY
  </text>

  <rect x="1" y="1" width="1198" height="158" rx="15" fill="none" stroke="#27272a" stroke-opacity="0.6" stroke-width="1"/>
</svg>