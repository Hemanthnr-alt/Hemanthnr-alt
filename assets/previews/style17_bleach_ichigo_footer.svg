<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="ichigoFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070204"/>
      <stop offset="50%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#070204"/>
    </linearGradient>
    <linearGradient id="ichigoChain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#ichigoFootGrad)"/>
  
  <!-- Tensa Zangetsu Black Chain Motif -->
  <line x1="80" y1="25" x2="1120" y2="25" stroke="url(#ichigoChain)" stroke-width="2" stroke-dasharray="8,6"/>
  <path d="M 0,160 L 600,100 L 1200,160 Z" fill="#ff0033" opacity="0.15"/>

  <!-- Center Manji Cross Guard -->
  <g transform="translate(600, 52) scale(0.7)">
    <rect x="-14" y="-14" width="28" height="28" fill="#ff0033" rx="3"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <text x="600" y="100" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
    &#8220;If fate is a millstone, then we are the grist. I will shatter fate with my own hands.&#8221;
  </text>
  <text x="600" y="127" text-anchor="middle" fill="#fda4af" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="2">
    ICHIGO KUROSAKI // SUBSTITUTE SHINIGAMI CREED
  </text>

  <rect x="1" y="1" width="1198" height="158" rx="15" fill="none" stroke="#ff0033" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>