<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="minFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#minFootGrad)"/>

  <!-- Minimal Hairline Wave (Calm Grand Line Horizon) -->
  <path d="M 0,40 Q 300,32 600,40 T 1200,40" fill="none" stroke="url(#goldLine)" stroke-width="1.2"/>
  
  <!-- Tiny Minimalist Thousand Sunny Anchor Silhouette -->
  <g transform="translate(600, 40)" opacity="0.9">
    <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
    <line x1="0" y1="4" x2="0" y2="18" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M -8,14 Q 0,22 8,14" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Quote in Clean Typography -->
  <text x="600" y="94" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" letter-spacing="0.3">
    &#8220;Inherited Will, the swelling of the era, the dreams of people... these things cannot be stopped.&#8221;
  </text>
  <text x="600" y="122" text-anchor="middle" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="2.5">
    GOL D. ROGER &#8226; GRAND LINE LATITUDE &#8226; CRAFT WITH PURPOSE
  </text>

  <rect x="1" y="1" width="1198" height="158" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>
</svg>