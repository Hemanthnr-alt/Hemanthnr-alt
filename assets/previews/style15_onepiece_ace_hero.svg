<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <radialGradient id="fireCore" cx="80%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#e11d48" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#0f0502" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireBall" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <linearGradient id="fireBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#0a0302"/>
  <rect width="1200" height="380" rx="16" fill="url(#fireCore)"/>

  <!-- Spiraling Fire Waves / Solar Eruption (Right side Hiken) -->
  <g opacity="0.4">
    <path d="M 850,380 Q 950,220 1020,180 T 1180,120 Q 1120,260 1040,320 Z" fill="#ea580c"/>
    <path d="M 920,380 Q 1000,260 1060,210 T 1200,180 Q 1160,300 1100,380 Z" fill="#f59e0b"/>
    <circle cx="1020" cy="180" r="110" fill="url(#fireBall)" opacity="0.3"/>
  </g>

  <!-- Ace's Hat Skull Motif & Crossed Dagger / Flames -->
  <g transform="translate(1000, 180)" opacity="0.8">
    <circle cx="0" cy="0" r="50" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <!-- Red bead necklace ring -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="6,6"/>
    <!-- Smiley Face Badge -->
    <circle cx="-16" cy="-10" r="8" fill="#fbbf24"/>
    <circle cx="-18" cy="-12" r="1.5" fill="#000"/>
    <circle cx="-14" cy="-12" r="1.5" fill="#000"/>
    <path d="M -20,-8 Q -16,-4 -12,-8" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Sad Face Badge -->
    <circle cx="16" cy="-10" r="8" fill="#fbbf24"/>
    <circle cx="14" cy="-12" r="1.5" fill="#000"/>
    <circle cx="18" cy="-12" r="1.5" fill="#000"/>
    <path d="M 12,-6 Q 16,-10 20,-6" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="24" text-anchor="middle" fill="#fef3c7" font-family="'Impact', sans-serif" font-size="14" letter-spacing="2">A C E</text>
  </g>

  <!-- Japanese Kanji & Main Headers -->
  <text x="70" y="80" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="4">ONE PIECE // MERA MERA NO MI // 火拳の意志</text>
  <text x="70" y="145" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="2">FIRE FIST INFERNO</text>
  <text x="70" y="185" fill="#fed7aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">The Inherited Will &#8212; Fueling Relentless Architecture &amp; Execution</text>

  <!-- Subtitle -->
  <text x="70" y="222" fill="#fb923c" font-family="'SF Mono', monospace" font-size="13" font-weight="500">
    Hemanth &#8226; Passionate Builder &#8226; Kotlin, TypeScript, High-Heat Shipping
  </text>

  <!-- Metric Badges -->
  <g transform="translate(70, 260)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#451a03" fill-opacity="0.7" stroke="#f97316" stroke-width="1.5"/>
    <text x="16" y="17" fill="#fdba74" font-family="'SF Mono', monospace" font-size="9" font-weight="700">DEVIL FRUIT</text>
    <text x="16" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">MERA MERA NO MI</text>

    <!-- Badge 2 -->
    <rect x="180" y="0" width="175" height="42" rx="10" fill="#451a03" fill-opacity="0.7" stroke="#f97316" stroke-width="1.5"/>
    <text x="196" y="17" fill="#fdba74" font-family="'SF Mono', monospace" font-size="9" font-weight="700">SPECIAL ATTACK</text>
    <text x="196" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">HIKEN (FIRE FIST)</text>

    <!-- Badge 3 -->
    <rect x="370" y="0" width="165" height="42" rx="10" fill="#451a03" fill-opacity="0.7" stroke="#f97316" stroke-width="1.5"/>
    <text x="386" y="17" fill="#fdba74" font-family="'SF Mono', monospace" font-size="9" font-weight="700">LEGACY</text>
    <text x="386" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">INHERITED WILL</text>

    <!-- Badge 4 -->
    <rect x="550" y="0" width="165" height="42" rx="10" fill="#451a03" fill-opacity="0.7" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="566" y="17" fill="#fdba74" font-family="'SF Mono', monospace" font-size="9" font-weight="700">COMPILE SPEED</text>
    <text x="566" y="32" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">10,000&#176;C BURST</text>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#fireBorder)" stroke-width="2"/>
</svg>