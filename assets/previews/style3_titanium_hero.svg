<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Matte Carbon Canvas -->
    <linearGradient id="titan-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#0d0d10" />
    </linearGradient>

    <!-- Frosted Glass Monolith -->
    <linearGradient id="frosted-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161c" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0e0e12" stop-opacity="0.85" />
    </linearGradient>

    <!-- Titanium Brushed Metal Typography -->
    <linearGradient id="titan-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- 1px Specular Border -->
    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18" />
    </linearGradient>

    <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif; }
  </style>

  <!-- Carbon Matte Canvas -->
  <rect width="1200" height="400" fill="url(#titan-bg)" />

  <!-- Subtle Ambient Top Light -->
  <ellipse cx="600" cy="0" rx="450" ry="140" fill="#ffffff" fill-opacity="0.03" />

  <!-- The Frosted Glass Monolith Centerpiece -->
  <g transform="translate(60, 40)" filter="url(#glass-shadow)">
    <rect width="1080" height="320" rx="20" fill="url(#frosted-glass)" stroke="url(#glass-specular)" stroke-width="1" />

    <!-- Top Minimalist Meta Strip -->
    <g transform="translate(36, 32)">
      <text x="0" y="0" class="mono" font-size="11" fill="#64748b" letter-spacing="2">
        HEMANTH NAIDU // ARCHITECTURE DIRECTIVE
      </text>
      <text x="1008" y="0" text-anchor="end" class="mono" font-size="11" fill="#94a3b8" letter-spacing="2">
        [ MODE: SOVEREIGN &#8226; ZERO-CLOUD ]
      </text>
    </g>

    <line x1="36" y1="52" x2="1044" y2="52" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

    <!-- Main Titanium Name -->
    <text x="540" y="152" text-anchor="middle" class="sans" font-size="76" font-weight="800" fill="url(#titan-metal)" letter-spacing="4">
      Hemanth Naidu
    </text>

    <!-- Subtitle -->
    <text x="540" y="196" text-anchor="middle" class="sans" font-size="19" font-weight="500" fill="#94a3b8" letter-spacing="1">
      Architecting Local-First Systems &bull; Android Specialist &bull; Full-Stack Engineer
    </text>

    <!-- 4 Clean Monochrome Glass Tags -->
    <g transform="translate(160, 236)">
      <rect width="176" height="32" rx="16" fill="#1e1e26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <text x="88" y="20" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#e2e8f0">0ms Zero-Latency</text>

      <g transform="translate(192, 0)">
        <rect width="186" height="32" rx="16" fill="#1e1e26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
        <text x="93" y="20" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#e2e8f0">Client Sovereignty</text>
      </g>

      <g transform="translate(394, 0)">
        <rect width="176" height="32" rx="16" fill="#1e1e26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
        <text x="88" y="20" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#e2e8f0">Android Native</text>
      </g>

      <g transform="translate(586, 0)">
        <rect width="176" height="32" rx="16" fill="#1e1e26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
        <text x="88" y="20" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#e2e8f0">Production Ready</text>
      </g>
    </g>
  </g>
</svg>