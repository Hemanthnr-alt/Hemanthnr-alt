<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="nikaFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="whiteLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#nikaFootGrad)"/>

  <!-- Minimal Heartbeat Horizon Line -->
  <path d="M 100,40 L 520,40 L 530,32 L 540,48 L 550,28 L 560,52 L 570,40 L 630,40 L 640,32 L 650,48 L 660,28 L 670,52 L 680,40 L 1100,40" fill="none" stroke="url(#whiteLine)" stroke-width="1.2"/>

  <!-- Center Floating Straw Hat Icon -->
  <g transform="translate(600, 36) scale(0.7)">
    <path d="M -18,-5 C -18,-18 18,-18 18,-5 Z" fill="#07090e" stroke="#f59e0b" stroke-width="2"/>
    <path d="M -18,-5 C -18,-10 18,-10 18,-5 Z" fill="#ef4444"/>
    <path d="M -30,-4 Q 0,-12 30,-4 Q 0,-8 -30,-4 Z" fill="#f59e0b"/>
  </g>

  <!-- Luffy's Core Doctrine Quote -->
  <text x="600" y="94" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="500">
    &#8220;I don&#8217;t want to conquer anything. The person with the most freedom on this sea is the Pirate King!&#8221;
  </text>
  <text x="600" y="122" text-anchor="middle" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="2.5">
    MONKEY D. LUFFY &#8226; THE CREED OF ABSOLUTE FREEDOM
  </text>

  <rect x="1" y="1" width="1198" height="158" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>
</svg>