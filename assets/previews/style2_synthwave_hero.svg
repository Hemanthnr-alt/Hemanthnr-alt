<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- 80s Dusk Sky Gradient -->
    <linearGradient id="synth-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0314" />
      <stop offset="35%" stop-color="#240738" />
      <stop offset="70%" stop-color="#590947" />
      <stop offset="100%" stop-color="#a81b5c" />
    </linearGradient>

    <!-- Neon Sunset Sun Gradient -->
    <linearGradient id="neon-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="40%" stop-color="#ff007f" />
      <stop offset="80%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#2d0538" />
    </linearGradient>

    <!-- Neon Title Gradient -->
    <linearGradient id="synth-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="synth-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-synth-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#ff007f" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes sun-pulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.8; } }
    @keyframes grid-drift { 0% { transform: translateY(0px); } 100% { transform: translateY(28px); } }
    .sun { animation: sun-pulse 3s infinite ease-in-out; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Sky Canvas -->
  <rect width="1200" height="420" fill="url(#synth-sky)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="100" cy="50" r="1.2" /><circle cx="250" cy="80" r="1.5" /><circle cx="400" cy="40" r="1" />
    <circle cx="850" cy="60" r="1.5" /><circle cx="1020" cy="45" r="1.2" /><circle cx="1140" cy="90" r="1.8" />
  </g>

  <!-- Giant Striped Neon Sun -->
  <g class="sun" transform="translate(600, 240)">
    <circle cx="0" cy="0" r="130" fill="url(#neon-sun)" filter="url(#synth-glow)" />
    <!-- Sun Horizon Cutout Stripes -->
    <rect x="-140" y="-10" width="280" height="4" fill="#1e0529" />
    <rect x="-140" y="8" width="280" height="6" fill="#1e0529" />
    <rect x="-140" y="28" width="280" height="9" fill="#1e0529" />
    <rect x="-140" y="52" width="280" height="12" fill="#1e0529" />
    <rect x="-140" y="80" width="280" height="16" fill="#1e0529" />
  </g>

  <!-- 3D Perspective Outrun Grid -->
  <g stroke="#ff007f" stroke-width="1.2" stroke-opacity="0.65" filter="url(#synth-glow)">
    <!-- Horizon Separator -->
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#00f2fe" stroke-width="2" />
    <!-- Converging Grid Lines -->
    <line x1="600" y1="260" x2="-200" y2="420" /><line x1="600" y1="260" x2="50" y2="420" />
    <line x1="600" y1="260" x2="250" y2="420" /><line x1="600" y1="260" x2="420" y2="420" />
    <line x1="600" y1="260" x2="540" y2="420" /><line x1="600" y1="260" x2="660" y2="420" />
    <line x1="600" y1="260" x2="780" y2="420" /><line x1="600" y1="260" x2="950" y2="420" />
    <line x1="600" y1="260" x2="1150" y2="420" /><line x1="600" y1="260" x2="1400" y2="420" />
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="0" y1="290" x2="1200" y2="290" />
    <line x1="0" y1="316" x2="1200" y2="316" />
    <line x1="0" y1="352" x2="1200" y2="352" />
    <line x1="0" y1="400" x2="1200" y2="400" stroke-width="2" />
  </g>

  <!-- Top Retro HUD Strip -->
  <g transform="translate(60, 32)">
    <text x="0" y="12" class="mono" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="2">// SYNTH_MODE: ACTIVE &#8226; 1984_OVERDRIVE</text>
    <text x="1080" y="12" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#ffe600" letter-spacing="2">&#9679; 0% TELEMETRY &#8226; 100% LOCAL-FIRST</text>
  </g>

  <!-- Main Hero Title -->
  <g filter="url(#text-synth-shadow)">
    <text x="600" y="150" text-anchor="middle" class="display" font-size="84" font-weight="900" fill="url(#synth-title)" letter-spacing="6">
      HEMANTH NAIDU
    </text>
  </g>

  <!-- Subtitle -->
  <g filter="url(#text-synth-shadow)">
    <text x="600" y="196" text-anchor="middle" class="display" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="2">
      ARCHITECTING <tspan fill="#00f2fe">LOCAL-FIRST SYSTEMS</tspan> &#8226; <tspan fill="#ffe600">ANDROID</tspan> &#8226; <tspan fill="#ff007f">FULL-STACK</tspan>
    </text>
  </g>

  <!-- Retro Floating Badges -->
  <g transform="translate(210, 222)">
    <rect width="180" height="28" rx="14" fill="#120420" stroke="#00f2fe" stroke-width="1.2" />
    <text x="90" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#00f2fe">&#9889; 0ms LATENCY</text>

    <g transform="translate(195, 0)">
      <rect width="190" height="28" rx="14" fill="#120420" stroke="#ff007f" stroke-width="1.2" />
      <text x="95" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#ff007f">&#128737; SOVEREIGN DB</text>
    </g>

    <g transform="translate(400, 0)">
      <rect width="180" height="28" rx="14" fill="#120420" stroke="#ffe600" stroke-width="1.2" />
      <text x="90" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#ffe600">&#128241; ANDROID CORE</text>
    </g>

    <g transform="translate(595, 0)">
      <rect width="185" height="28" rx="14" fill="#120420" stroke="#a855f7" stroke-width="1.2" />
      <text x="92" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#c084fc">&#128293; PROD SHIPPED</text>
    </g>
  </g>
</svg>