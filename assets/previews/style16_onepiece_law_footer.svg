<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="lawFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030c14"/>
      <stop offset="50%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#030c14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#lawFootGrad)"/>
  
  <!-- Cyan Forcefield Arc -->
  <path d="M 200,160 Q 600,60 1000,160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,8" opacity="0.6"/>

  <!-- Center Knot / Nodachi Kikoku Crest -->
  <g transform="translate(600, 48)">
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#facc15" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#000"/>
  </g>

  <text x="600" y="98" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
    &#8220;The weak don&#8217;t get to decide anything, not even how they die. Build undeniable strength.&#8221;
  </text>
  <text x="600" y="125" text-anchor="middle" fill="#7dd3fc" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="2">
    TRAFALGAR D. WATER LAW // SURGEON OF DEATH PHILOSOPHY
  </text>

  <rect x="1" y="1" width="1198" height="158" rx="15" fill="none" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>