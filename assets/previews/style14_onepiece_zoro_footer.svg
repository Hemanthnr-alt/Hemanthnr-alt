<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="zoroFootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020e0a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020e0a"/>
    </linearGradient>
    <linearGradient id="zoroFootLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="16" fill="url(#zoroFootGrad)"/>
  
  <!-- Green Flame Slash Across Footer -->
  <polygon points="0,110 1200,40 1200,48 0,118" fill="#10b981" opacity="0.3"/>
  <line x1="100" y1="20" x2="1100" y2="20" stroke="url(#zoroFootLine)" stroke-width="2"/>

  <!-- Center Katana Cross & Quote -->
  <g transform="translate(600, 65)">
    <line x1="-30" y1="-12" x2="30" y2="12" stroke="#34d399" stroke-width="2.5"/>
    <line x1="-30" y1="12" x2="30" y2="-12" stroke="#a7f3d0" stroke-width="2.5"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#f0fdf4" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#10b981"/>
  </g>

  <text x="600" y="105" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
    &#8220;Scars on the back are a swordsman&#8217;s greatest shame. No compromise in code.&#8221;
  </text>
  <text x="600" y="130" text-anchor="middle" fill="#6ee7b7" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="2">
    RORONOA ZORO &#8212; KING OF HELL DOCTRINE // SHIP WITH CONVICTION
  </text>

  <rect x="1" y="1" width="1198" height="158" rx="15" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>