<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 40" width="185" height="40">
  <defs>
    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3c50"/>
      <stop offset="50%" stop-color="#f0233c"/>
      <stop offset="100%" stop-color="#ff6579"/>
    </linearGradient>
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190d1e"/>
      <stop offset="100%" stop-color="#0c0610"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .bold { font-weight: 700; }
  </style>

  <!-- Button Box -->
  <rect x="1" y="1" width="183" height="38" rx="10" fill="url(#btnBg)" stroke="url(#btnBorder)" stroke-width="1.2"/>
  <!-- Top Accent Indicator -->
  <line x1="14" y1="1" x2="45" y2="1" stroke="#ff3c50" stroke-width="2" stroke-linecap="round"/>

  <!-- Icon Area -->
  <g transform="translate(12, 10)">
    <rect x="2" y="2" width="16" height="16" rx="3" fill="none" stroke="#0ea5e9" stroke-width="1.4"/>
<text x="5" y="14" fill="#0ea5e9" font-size="11" font-family="sans-serif" font-weight="bold">in</text>
  </g>

  <!-- Text -->
  <text x="42" y="18" fill="#ffffff" font-size="10.5" class="sans bold" letter-spacing="0.3">LINKEDIN</text>
  <text x="42" y="30" fill="#ff99a8" font-size="8.5" class="mono">in/hemanthnaidu</text>
</svg>