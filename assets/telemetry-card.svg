<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#6c5ce7" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Background -->
    <pattern id="telemetryGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.12" />
    </filter>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes blink-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .live-dot { animation: blink-green 1.8s infinite ease-in-out; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="996" height="276" rx="18" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.6" filter="url(#cardGlow)" />
  <rect x="2" y="2" width="996" height="276" rx="18" fill="url(#telemetryGrid)" />

  <!-- Top Header Bar -->
  <g transform="translate(28, 28)">
    <!-- Circuit Bracket -->
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#00f2fe" stroke-width="2" />
    <text x="24" y="14" class="sans" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      SYSTEM TELEMETRY &amp; HARDWARE DIRECTIVES
    </text>
    <text x="24" y="28" class="mono" font-size="10" fill="#64748b" letter-spacing="1">
      ARCHITECTURE SPECS // DETERMINISTIC LOCAL-FIRST COMPUTING
    </text>

    <!-- Right-aligned Live Status -->
    <rect x="760" y="-4" width="176" height="26" rx="13" fill="#0c1e14" stroke="#10b981" stroke-width="1" />
    <circle cx="776" cy="9" r="4.5" fill="#10b981" class="live-dot" />
    <text x="788" y="13" class="mono" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="1">TELEMETRY: 0% ZERO</text>
  </g>

  <!-- Divider Line -->
  <line x1="28" y1="72" x2="972" y2="72" stroke="#1e293b" stroke-width="1" />

  <!-- 4 Column Spec Blocks -->
  <!-- Block 1: Architecture -->
  <g transform="translate(32, 90)">
    <rect width="216" height="112" rx="12" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" class="mono" font-size="10.5" font-weight="700" fill="#00f2fe">● SOVEREIGN STORAGE</text>
    <text x="16" y="52" class="sans" font-size="17" font-weight="800" fill="#f8fafc">IndexedDB + SQLite</text>
    <text x="16" y="72" class="sans" font-size="11" fill="#94a3b8">100% on-device sandboxed</text>
    <text x="16" y="90" class="mono" font-size="10" fill="#38bdf8">LATENCY: &lt;0.8ms</text>
  </g>

  <!-- Block 2: Audio Synthesis -->
  <g transform="translate(268, 90)">
    <rect width="216" height="112" rx="12" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" class="mono" font-size="10.5" font-weight="700" fill="#c084fc">● AUDIO ENGINE</text>
    <text x="16" y="52" class="sans" font-size="17" font-weight="800" fill="#f8fafc">Web Audio API</text>
    <text x="16" y="72" class="sans" font-size="11" fill="#94a3b8">Procedural 40Hz Waves</text>
    <text x="16" y="90" class="mono" font-size="10" fill="#a855f7">BUFFER: 0MB OFFLINE</text>
  </g>

  <!-- Block 3: Native Bridge -->
  <g transform="translate(504, 90)">
    <rect width="216" height="112" rx="12" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" class="mono" font-size="10.5" font-weight="700" fill="#34d399">● MOBILE EXECUTION</text>
    <text x="16" y="52" class="sans" font-size="17" font-weight="800" fill="#f8fafc">Capacitor 8 / Native</text>
    <text x="16" y="72" class="sans" font-size="11" fill="#94a3b8">Foreground Service &amp; Doze</text>
    <text x="16" y="90" class="mono" font-size="10" fill="#4ade80">TARGET: ANDROID 8-14+</text>
  </g>

  <!-- Block 4: Privacy & Security -->
  <g transform="translate(740, 90)">
    <rect width="224" height="112" rx="12" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" class="mono" font-size="10.5" font-weight="700" fill="#f472b6">● SECURITY VAULT</text>
    <text x="16" y="52" class="sans" font-size="17" font-weight="800" fill="#f8fafc">Triple-Tap PIN Vault</text>
    <text x="16" y="72" class="sans" font-size="11" fill="#94a3b8">Stealth PIN-lock keypad</text>
    <text x="16" y="90" class="mono" font-size="10" fill="#ec4899">AIR-GAPPED: 100%</text>
  </g>

  <!-- Bottom Command Line Strip -->
  <g transform="translate(32, 222)">
    <rect width="936" height="36" rx="8" fill="#070a10" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="22" class="mono" font-size="11" fill="#00f2fe">&gt;_</text>
    <text x="40" y="22" class="mono" font-size="11" fill="#e2e8f0">
      DOCTRINE: <tspan fill="#34d399">zero-cloud</tspan> &#8226; <tspan fill="#00f2fe">zero-telemetry</tspan> &#8226; <tspan fill="#c084fc">zero-subscription</tspan> &#8226; <tspan fill="#f472b6">100% user-owned computation</tspan>
    </text>
    <text x="918" y="22" text-anchor="end" class="mono" font-size="10" fill="#64748b">[SYS_CHECK: PASS]</text>
  </g>
</svg>