<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07020d" />
      <stop offset="50%" stop-color="#110418" />
      <stop offset="100%" stop-color="#0a0308" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0233c" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#ff3c50" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff3c50" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f0233c" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3c50" />
      <stop offset="100%" stop-color="#ff8093" />
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0233c" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <pattern id="telemetryGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ff3c50" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f0233c" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes blink-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .live-dot { animation: blink-green 1.8s infinite ease-in-out; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="996" height="276" rx="18" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.6" filter="url(#cardGlow)" />
  <rect x="2" y="2" width="996" height="276" rx="18" fill="url(#telemetryGrid)" />

  <!-- Window Header -->
  <g transform="translate(30, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#f0233c" />
    <circle cx="22" cy="6" r="4.5" fill="#f59e0b" />
    <circle cx="38" cy="6" r="4.5" fill="#22c55e" />
    <text x="56" y="10" fill="#94a3b8" font-size="11.5" class="mono">telemetry://hemanth-naidu/hardware-directives</text>
    
    <!-- Pulse Badge -->
    <rect x="790" y="-3" width="150" height="22" rx="11" fill="#18040d" stroke="#f0233c" stroke-width="1" />
    <circle cx="804" cy="8" r="4" fill="#ff3c50" class="live-dot" />
    <text x="816" y="12" fill="#ff8093" font-size="9.5" font-weight="bold" class="mono">CONQUEROR CORE</text>
  </g>

  <!-- Title & Intro -->
  <text x="32" y="74" fill="#ffffff" font-size="18" font-weight="800" class="sans">SYSTEM TELEMETRY &amp; HARDWARE DIRECTIVES</text>
  <text x="32" y="93" fill="#cbd5e1" font-size="12" class="sans">Real-time performance metrics and architectural baselines across production hardware</text>

  <!-- 3 Metric Pillars -->
  <!-- Pillar 1: Compute & Latency -->
  <g transform="translate(30, 114)">
    <rect width="298" height="136" rx="12" fill="#15051b" stroke="#320b3e" stroke-width="1" />
    <text x="20" y="28" fill="url(#goldGrad)" font-size="12" font-weight="700" class="sans">01 / LATENCY &amp; QUERY CADENCE</text>
    <text x="20" y="60" fill="#ffffff" font-size="28" font-weight="800" class="mono">&lt; 0.8ms</text>
    <text x="20" y="82" fill="#94a3b8" font-size="11" class="sans">Deterministic SQLite local execution</text>
    <rect x="20" y="98" width="258" height="6" rx="3" fill="#260931" />
    <rect x="20" y="98" width="248" height="6" rx="3" fill="url(#goldGrad)" />
    <text x="20" y="122" fill="#ff8093" font-size="10" class="mono">BENCHMARK: 99.4% OPTIMAL</text>
  </g>

  <!-- Pillar 2: Offline Availability -->
  <g transform="translate(350, 114)">
    <rect width="298" height="136" rx="12" fill="#1a0907" stroke="#3f130b" stroke-width="1" />
    <text x="20" y="28" fill="url(#crimsonGrad)" font-size="12" font-weight="700" class="sans">02 / OFFLINE SOVEREIGNTY</text>
    <text x="20" y="60" fill="#ffffff" font-size="28" font-weight="800" class="mono">100.0%</text>
    <text x="20" y="82" fill="#94a3b8" font-size="11" class="sans">Zero cloud dependency on-device</text>
    <rect x="20" y="98" width="258" height="6" rx="3" fill="#300d07" />
    <rect x="20" y="98" width="258" height="6" rx="3" fill="url(#crimsonGrad)" />
    <text x="20" y="122" fill="#fb7185" font-size="10" class="mono">TELEMETRY PIPELINES: ZERO</text>
  </g>

  <!-- Pillar 3: Frame Budget -->
  <g transform="translate(670, 114)">
    <rect width="298" height="136" rx="12" fill="#13071b" stroke="#2a0d36" stroke-width="1" />
    <text x="20" y="28" fill="url(#greenGrad)" font-size="12" font-weight="700" class="sans">03 / UI FRAME BUDGET</text>
    <text x="20" y="60" fill="#ffffff" font-size="28" font-weight="800" class="mono">60 FPS</text>
    <text x="20" y="82" fill="#94a3b8" font-size="11" class="sans">16.6ms frame ceiling without drop</text>
    <rect x="20" y="98" width="258" height="6" rx="3" fill="#200a29" />
    <rect x="20" y="98" width="250" height="6" rx="3" fill="url(#greenGrad)" />
    <text x="20" y="122" fill="#4ade80" font-size="10" class="mono">FLUID INTERACTIVE DISPATCH</text>
  </g>
</svg>