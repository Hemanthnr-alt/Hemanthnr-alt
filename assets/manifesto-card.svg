  <!-- Card 4 -->
  <rect x="624" y="60" width="186" height="142" rx="10" fill="url(#manCard)" stroke="#232e3f" stroke-width="1"/>
  <text x="640" y="92" font-size="22">📱</text>
  <text x="640" y="118" fill="#f093fb" font-size="13" class="sans bold">60fps Native UX</text>
  <text x="640" y="140" fill="#8b949e" font-size="11" class="sans">Hardware accelerated</text>
