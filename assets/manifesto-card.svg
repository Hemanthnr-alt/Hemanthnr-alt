  <!-- 4 Cards -->
  <!-- Card 1 -->
  <rect x="24" y="60" width="186" height="142" rx="10" fill="url(#manCard)" stroke="#232e3f" stroke-width="1"/>
  <text x="40" y="92" font-size="22">⚡</text>
  <text x="40" y="118" fill="#00f2fe" font-size="13" class="sans bold">Zero Cloud Latency</text>
