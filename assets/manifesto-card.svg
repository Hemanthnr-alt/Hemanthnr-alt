      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <linearGradient id="manBg" x1="0%" y1="0%" x2="100%" y2="100%">
