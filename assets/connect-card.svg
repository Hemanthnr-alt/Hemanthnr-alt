<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="100%" height="100%">
  <defs>
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07020d" />
      <stop offset="50%" stop-color="#110418" />
      <stop offset="100%" stop-color="#08020e" />
    </linearGradient>

    <linearGradient id="connectBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glowRed" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGold" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ff0055" flood-opacity="0.15" />
    </filter>

    <pattern id="connectGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-beacon { animation: pulse-green 1.8s infinite ease-in-out; }
  </style>

  <!-- Frame Base -->
  <rect x="2" y="2" width="996" height="286" rx="18" fill="url(#connectBg)" stroke="url(#connectBorder)" stroke-width="1.6" filter="url(#cardGlow)" />
  <rect x="2" y="2" width="996" height="286" rx="18" fill="url(#connectGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="110" r="180" fill="url(#glowRed)" />
  <circle cx="800" cy="130" r="190" fill="url(#glowGold)" />

  <!-- Top Bar -->
  <g transform="translate(30, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#ff0055" />
    <circle cx="22" cy="6" r="4.5" fill="#f59e0b" />
    <circle cx="38" cy="6" r="4.5" fill="#22c55e" />
    <text x="56" y="10" fill="#94a3b8" font-size="11.5" class="mono">relay://hemanth-naidu/communications-terminal</text>
    
    <rect x="760" y="-3" width="180" height="22" rx="11" fill="#241403" stroke="#f59e0b" stroke-width="1" />
    <circle cx="774" cy="8" r="4" fill="#fbbf24" class="live-beacon" />
    <text x="786" y="12" fill="#fbbf24" font-size="9.5" font-weight="bold" class="mono">RELAY DISPATCH OPEN</text>
  </g>

  <!-- Title -->
  <text x="32" y="76" fill="#ffffff" font-size="20" font-weight="800" class="sans">COMMUNICATIONS TERMINAL &amp; RELAY</text>
  <text x="32" y="96" fill="#cbd5e1" font-size="12" class="sans">Open to Software Engineering roles, collaborative architecture, and technical product inquiries</text>

  <!-- 3 Communication Action Channels -->
  <!-- Channel 1: Email Direct -->
  <g transform="translate(30, 120)">
    <rect width="298" height="136" rx="12" fill="#18040d" stroke="#3d0a21" stroke-width="1" />
    <text x="20" y="28" fill="#ff0055" font-size="12" font-weight="700" class="sans">DIRECT PROTOCOL</text>
    <text x="20" y="56" fill="#ffffff" font-size="15" font-weight="700" class="mono">hemanthnaidunr@gmail.com</text>
    <text x="20" y="80" fill="#94a3b8" font-size="11" class="sans">Inquiries, full-time engineering offers &amp; technical advisory</text>
    <rect x="20" y="98" width="130" height="24" rx="6" fill="#240311" stroke="#ff0055" stroke-width="1" />
    <text x="36" y="114" fill="#fde047" font-size="10" font-weight="bold" class="mono">SEND DISPATCH &#8594;</text>
  </g>

  <!-- Channel 2: LinkedIn Network -->
  <g transform="translate(350, 120)">
    <rect width="298" height="136" rx="12" fill="#170620" stroke="#320b3e" stroke-width="1" />
    <text x="20" y="28" fill="#f59e0b" font-size="12" font-weight="700" class="sans">PROFESSIONAL GRAPH</text>
    <text x="20" y="56" fill="#ffffff" font-size="15" font-weight="700" class="mono">linkedin.com/in/hemanthnaidu</text>
    <text x="20" y="80" fill="#94a3b8" font-size="11" class="sans">Career history, endorsements, system design posts &amp; network</text>
    <rect x="20" y="98" width="130" height="24" rx="6" fill="#241403" stroke="#f59e0b" stroke-width="1" />
    <text x="36" y="114" fill="#fde047" font-size="10" font-weight="bold" class="mono">CONNECT GRAPH &#8594;</text>
  </g>

  <!-- Channel 3: Production Live Link -->
  <g transform="translate(670, 120)">
    <rect width="298" height="136" rx="12" fill="#08151f" stroke="#0e2f46" stroke-width="1" />
    <text x="20" y="28" fill="#00f2fe" font-size="12" font-weight="700" class="sans">DEPLOYED SYSTEMS</text>
    <text x="20" y="56" fill="#ffffff" font-size="15" font-weight="700" class="mono">lock-in-eta-nine.vercel.app</text>
    <text x="20" y="80" fill="#94a3b8" font-size="11" class="sans">Live progressive web application &amp; APK distribution hub</text>
    <rect x="20" y="98" width="130" height="24" rx="6" fill="#051c27" stroke="#00f2fe" stroke-width="1" />
    <text x="36" y="114" fill="#38bdf8" font-size="10" font-weight="bold" class="mono">LAUNCH PWA &#8594;</text>
  </g>
</svg>