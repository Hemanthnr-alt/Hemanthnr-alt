<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="40%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="connectBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#6c5ce7" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowViolet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Filter -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00f2fe" flood-opacity="0.12" />
    </filter>

    <pattern id="connectGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-beacon { animation: pulse-green 1.8s infinite ease-in-out; }
  </style>

  <!-- Frame Base -->
  <rect x="2" y="2" width="996" height="286" rx="18" fill="url(#connectBg)" stroke="url(#connectBorder)" stroke-width="1.6" filter="url(#cardGlow)" />
  <rect x="2" y="2" width="996" height="286" rx="18" fill="url(#connectGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="110" r="180" fill="url(#glowViolet)" />
  <circle cx="800" cy="130" r="190" fill="url(#glowCyan)" />

  <!-- Top Bar -->
  <g transform="translate(30, 26)">
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#00f2fe" stroke-width="2" />
    <text x="26" y="14" class="sans" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      COMMUNICATIONS TERMINAL &amp; RELAY
    </text>
    <text x="26" y="28" class="mono" font-size="10" fill="#64748b" letter-spacing="1">
      DIRECT OPERATOR CHANNEL // READY FOR COLLABORATION
    </text>

    <!-- Status Pill -->
    <rect x="670" y="-4" width="270" height="26" rx="13" fill="#0c1e14" stroke="#10b981" stroke-width="1" />
    <circle cx="686" cy="9" r="4.5" fill="#10b981" class="live-beacon" />
    <text x="698" y="13" class="mono" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="1">OPEN TO SWE &amp; MOBILE ROLES</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="70" x2="970" y2="70" stroke="#1e293b" stroke-width="1" />

  <!-- Central Invitation Banner -->
  <g transform="translate(30, 84)">
    <text x="470" y="24" text-anchor="middle" class="sans" font-size="22" font-weight="900" fill="#f8fafc" letter-spacing="1">
      LET'S BUILD SOMETHING EXTRAORDINARY
    </text>
    <text x="470" y="46" text-anchor="middle" class="sans" font-size="13" fill="#94a3b8" letter-spacing="0.5">
      Actively open to <tspan fill="#00f2fe" font-weight="700">Full-Stack</tspan>, <tspan fill="#3ddc84" font-weight="700">Android / Native Mobile</tspan>, and <tspan fill="#c084fc" font-weight="700">Local-First Systems Engineering</tspan> opportunities.
    </text>
  </g>

  <!-- 4 Tactical Relay Channels -->
  <g transform="translate(30, 150)">
    <!-- Channel 1: Email -->
    <g transform="translate(0, 0)">
      <rect width="220" height="66" rx="10" fill="#0c1018" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
      <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#00f2fe">&#9993; DIRECT EMAIL</text>
      <text x="16" y="46" class="sans" font-size="11.5" font-weight="700" fill="#f8fafc">hemanthnaidunr@gmail.com</text>
    </g>

    <!-- Channel 2: LinkedIn -->
    <g transform="translate(240, 0)">
      <rect width="220" height="66" rx="10" fill="#0c1018" stroke="#0a66c2" stroke-opacity="0.4" stroke-width="1" />
      <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#38bdf8">&#128188; LINKEDIN</text>
      <text x="16" y="46" class="sans" font-size="12" font-weight="700" fill="#f8fafc">linkedin.com/in/hemanthnaidu</text>
    </g>

    <!-- Channel 3: Production Web -->
    <g transform="translate(480, 0)">
      <rect width="220" height="66" rx="10" fill="#0c1018" stroke="#6c5ce7" stroke-opacity="0.4" stroke-width="1" />
      <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#a855f7">&#127760; PRODUCTION LIVE</text>
      <text x="16" y="46" class="sans" font-size="12" font-weight="700" fill="#f8fafc">lock-in-eta-nine.vercel.app</text>
    </g>

    <!-- Channel 4: GitHub -->
    <g transform="translate(720, 0)">
      <rect width="220" height="66" rx="10" fill="#0c1018" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <text x="16" y="22" class="mono" font-size="10" font-weight="700" fill="#34d399">&#128187; SOURCE REPOS</text>
      <text x="16" y="46" class="sans" font-size="12" font-weight="700" fill="#f8fafc">github.com/Hemanthnr-alt</text>
    </g>
  </g>

  <!-- Bottom Command Doctrine Strip -->
  <g transform="translate(30, 234)">
    <rect width="940" height="36" rx="8" fill="#06080d" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" class="mono" font-size="10.5" fill="#00f2fe">&gt;_</text>
    <text x="36" y="22" class="mono" font-size="11" fill="#e2e8f0">
      &quot;Master the 1% standard &#8212; building at the intersection of productivity, systems &amp; performance.&quot;
    </text>
    <text x="924" y="22" text-anchor="end" class="mono" font-size="10" fill="#64748b">[RELAY: ACTIVE]</text>
  </g>
</svg>