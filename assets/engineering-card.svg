<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>

    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1d2e"/>
      <stop offset="100%" stop-color="#131722"/>
    </linearGradient>

    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121f28"/>
      <stop offset="100%" stop-color="#111822"/>
    </linearGradient>

    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
    .medium { font-weight: 600; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="836" height="396" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Window Header Bar -->
  <path d="M 2 18 C 2 9.16 9.16 2 18 2 L 822 2 C 830.84 2 838 9.16 838 18 L 838 42 L 2 42 Z" fill="#161b24"/>
  <line x1="2" y1="42" x2="838" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="24" cy="22" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="5.5" fill="#27c93f"/>

