<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0308"/>
      <stop offset="50%" stop-color="#12050e"/>
      <stop offset="100%" stop-color="#1a0614"/>
    </linearGradient>

    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#160510"/>
      <stop offset="100%" stop-color="#10030c"/>
    </linearGradient>

    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c0a06"/>
      <stop offset="100%" stop-color="#120403"/>
    </linearGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <linearGradient id="textCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
    .medium { font-weight: 600; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="836" height="396" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Window Header Bar -->
  <path d="M 2 18 C 2 9.16 9.16 2 18 2 L 822 2 C 830.84 2 838 9.16 838 18 L 838 42 L 2 42 Z" fill="#14040e"/>
  <line x1="2" y1="42" x2="838" y2="42" stroke="#2e081c" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="22" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="22" r="5.5" fill="#22c55e"/>

  <!-- Header Title -->
  <text x="80" y="26" fill="#94a3b8" font-size="12" class="mono">hemanth@lockin-core : ~/doctrine-and-systems</text>

  <!-- Status Pill in Header -->
  <rect x="680" y="12" width="140" height="20" rx="10" fill="#230310" stroke="#ef4444" stroke-width="1"/>
  <circle cx="693" cy="22" r="3.5" fill="#f59e0b"/>
  <text x="703" y="26" fill="#fde047" font-size="10" class="mono bold">PRODUCTION CORE</text>

  <!-- Grid Layout: 2 Primary Columns -->
  <!-- Left Box: Core Philosophy -->
  <rect x="24" y="58" width="380" height="318" rx="10" fill="url(#cardBg1)" stroke="#320b3f" stroke-width="1"/>
  
  <text x="44" y="88" fill="url(#textGold)" font-size="14" class="sans bold" letter-spacing="0.5">01 // CORE ENGINEERING DOCTRINE</text>
  <line x1="44" y1="98" x2="384" y2="98" stroke="#320b3f" stroke-width="1"/>

  <text x="44" y="124" fill="#f8fafc" font-size="12" class="sans bold">Offline-First is Not a Feature, It is Freedom</text>
  <text x="44" y="142" fill="#94a3b8" font-size="11" class="sans">Cloud servers fail, subscriptions expire, networks lag.</text>
  <text x="44" y="158" fill="#94a3b8" font-size="11" class="sans">Your tools must function with zero internet dependency.</text>

  <text x="44" y="190" fill="#f8fafc" font-size="12" class="sans bold">Data Sovereignty &amp; Privacy by Architecture</text>
  <text x="44" y="208" fill="#94a3b8" font-size="11" class="sans">Zero third-party trackers. Zero telemetry pipelines.</text>
  <text x="44" y="224" fill="#94a3b8" font-size="11" class="sans">User data lives and stays entirely inside SQLite on-device.</text>

  <text x="44" y="256" fill="#f8fafc" font-size="12" class="sans bold">Instantaneous Response Times (&lt;16ms)</text>
  <text x="44" y="274" fill="#94a3b8" font-size="11" class="sans">No network round-trips for routine CRUD operations.</text>
  <text x="44" y="290" fill="#94a3b8" font-size="11" class="sans">60fps fluid UI execution with immediate state updates.</text>

  <text x="44" y="322" fill="#f8fafc" font-size="12" class="sans bold">Single Codebase, Zero Compromise</text>
  <text x="44" y="340" fill="#94a3b8" font-size="11" class="sans">Native Android hardware widgets and responsive web apps,</text>
  <text x="44" y="356" fill="#94a3b8" font-size="11" class="sans">powered by React, TypeScript, and native bridge APIs.</text>

  <!-- Right Box: Systems Architecture -->
  <rect x="424" y="58" width="392" height="318" rx="10" fill="url(#cardBg2)" stroke="#3f130b" stroke-width="1"/>
  
  <text x="444" y="88" fill="url(#textCrimson)" font-size="14" class="sans bold" letter-spacing="0.5">02 // ARCHITECTURAL BLUEPRINT</text>
  <line x1="444" y1="98" x2="796" y2="98" stroke="#3f130b" stroke-width="1"/>

  <rect x="444" y="112" width="352" height="48" rx="6" fill="#200613" stroke="#ef4444" stroke-width="0.8"/>
  <text x="456" y="132" fill="#ef4444" font-size="11.5" class="mono bold">PRESENTATION LAYER</text>
  <text x="456" y="148" fill="#e2e8f0" font-size="11" class="sans">React 18 &#8226; Tailwind CSS &#8226; Vite &#8226; Lucide Icons &#8226; 60fps UI</text>

  <rect x="444" y="168" width="352" height="48" rx="6" fill="#201103" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="456" y="188" fill="#f59e0b" font-size="11.5" class="mono bold">CROSS-PLATFORM BRIDGE</text>
  <text x="456" y="204" fill="#e2e8f0" font-size="11" class="sans">Capacitor 6 &#8226; Native Android SDK &#8226; AppWidgetProvider</text>

  <rect x="444" y="224" width="352" height="48" rx="6" fill="#190624" stroke="#c084fc" stroke-width="0.8"/>
  <text x="456" y="244" fill="#c084fc" font-size="11.5" class="mono bold">DETERMINISTIC STORAGE</text>
  <text x="456" y="260" fill="#e2e8f0" font-size="11" class="sans">Native SQLite Engine &#8226; WAL Mode &#8226; Immediate Persistence</text>

  <rect x="444" y="280" width="352" height="48" rx="6" fill="#04181a" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="456" y="300" fill="#f59e0b" font-size="11.5" class="mono bold">SYSTEM PERFORMANCE</text>
  <text x="456" y="316" fill="#e2e8f0" font-size="11" class="sans">Sub-1ms Query Execution &#8226; Zero Cloud Outage Risk &#8226; Light Footprint</text>

  <!-- Architecture summary footer -->
  <text x="448" y="356" fill="#94a3b8" font-size="10.5" class="mono">STATUS: PRODUCTION AUDITED &#8226; BENCHMARK PASSING</text>
</svg>