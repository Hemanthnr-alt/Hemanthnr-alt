  <text x="752" y="265" fill="#4facfe" font-size="10.5" class="mono bold">LIVE</text>
  <text x="458" y="284" fill="#c9d1d9" font-size="11" class="sans">Live product site, instant APK downloads, sample executive PDF</text>
