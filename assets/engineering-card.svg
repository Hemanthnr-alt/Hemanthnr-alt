  <!-- ==================== BOTTOM STATUS BAR ==================== -->
  <line x1="2" y1="344" x2="838" y2="344" stroke="#21262d" stroke-width="1"/>
  
  <!-- Mini tags -->
  <text x="32" y="372" fill="#8b949e" font-size="11" class="mono">ENGINEER: Hemanth Naidu</text>
  <text x="240" y="372" fill="#8b949e" font-size="11" class="mono">LOCATION: Bengaluru, IN</text>
  <text x="450" y="372" fill="#8b949e" font-size="11" class="mono">FOCUS: Local-First • Mobile • Systems</text>
