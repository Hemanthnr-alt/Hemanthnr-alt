<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 90" width="100%" height="100%">
  <defs>
    <linearGradient id="crimsonDockBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3c50"/>
      <stop offset="30%" stop-color="#f0233c"/>
      <stop offset="70%" stop-color="#ff6579"/>
      <stop offset="100%" stop-color="#ff3c50"/>
    </linearGradient>

    <linearGradient id="crimsonDockBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a050d"/>
      <stop offset="50%" stop-color="#140816"/>
      <stop offset="100%" stop-color="#0a050d"/>
    </linearGradient>

    <linearGradient id="crimsonTextGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd5dc"/>
    </linearGradient>

    <filter id="rubyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
  </style>

  <!-- Container Dock Frame -->
  <rect x="2" y="2" width="836" height="86" rx="14" fill="url(#crimsonDockBg)" stroke="url(#crimsonDockBorder)" stroke-width="1.6"/>

  <!-- Top Accent Highlight -->
  <line x1="30" y1="2" x2="150" y2="2" stroke="#ff3c50" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Side: Terminal Icon & Doctrine -->
  <circle cx="36" cy="45" r="17" fill="#260814" stroke="#ff3c50" stroke-width="1.4"/>
  <path d="M37 36 L31 46 L36 46 L34 54 L42 43 L37 43 Z" fill="#ff4d66" filter="url(#rubyGlow)"/>
  <path d="M37 36 L31 46 L36 46 L34 54 L42 43 L37 43 Z" fill="#ffffff"/>

  <text x="68" y="38" fill="url(#crimsonTextGlow)" font-size="14" class="sans bold" letter-spacing="0.5">LOCAL-FIRST SYSTEMS ARCHITECT &amp; PRODUCT BUILDER</text>
  <text x="68" y="58" fill="#cbd5e1" font-size="11" class="mono">Deterministic On-Device SQLite &#8226; Zero Telemetry &#8226; Sub-1ms Latency</text>

  <!-- Right Side: Status Pills -->
  <rect x="662" y="20" width="154" height="22" rx="11" fill="#2d0c16" stroke="#ff3c50" stroke-width="1.2"/>
  <circle cx="676" cy="31" r="4" fill="#ff4d66" filter="url(#rubyGlow)"/>
  <circle cx="676" cy="31" r="3" fill="#ff8093"/>
  <text x="688" y="35" fill="#ffccd4" font-size="10" class="mono bold">LOCK IN v1.0 LIVE</text>

  <rect x="662" y="48" width="154" height="22" rx="11" fill="#220810" stroke="#f0233c" stroke-width="1.2"/>
  <circle cx="676" cy="59" r="4" fill="#f0233c"/>
  <text x="688" y="63" fill="#ff99a8" font-size="10" class="mono bold">OPEN TO SWE ROLES</text>
</svg>