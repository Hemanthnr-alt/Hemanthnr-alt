<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 90" width="100%" height="100%">
  <defs>
    <linearGradient id="subdockBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="subdockBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121622"/>
      <stop offset="50%" stop-color="#151b28"/>
      <stop offset="100%" stop-color="#111620"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
  </style>

  <!-- Container Dock Frame -->
  <rect x="2" y="2" width="836" height="86" rx="14" fill="url(#subdockBg)" stroke="url(#subdockBorder)" stroke-width="1.6"/>

  <!-- Left Side: Terminal Icon & Doctrine -->
  <circle cx="34" cy="45" r="16" fill="#1b2133" stroke="#2e3852" stroke-width="1"/>
  <text x="27" y="51" font-size="16">⚡</text>

  <text x="64" y="38" fill="url(#glowCyan)" font-size="14.5" class="sans bold" letter-spacing="0.5">LOCAL-FIRST SYSTEMS ARCHITECT &amp; PRODUCT BUILDER</text>
  <text x="64" y="58" fill="#8b949e" font-size="11.5" class="mono">Deterministic On-Device SQLite · Zero Telemetry · Sub-1ms Latency</text>

  <!-- Right Side: Status Pills -->
  <rect x="670" y="20" width="144" height="22" rx="11" fill="#13231b" stroke="#22c55e" stroke-width="1"/>
  <circle cx="684" cy="31" r="4" fill="#22c55e"/>
  <text x="696" y="35" fill="#22c55e" font-size="10" class="mono bold">LOCK IN v1.0 LIVE</text>

  <rect x="670" y="48" width="144" height="22" rx="11" fill="#1c1a2e" stroke="#a29bfe" stroke-width="1"/>
  <circle cx="684" cy="59" r="4" fill="#a29bfe"/>
  <text x="696" y="63" fill="#a29bfe" font-size="10" class="mono bold">OPEN TO SWE ROLES</text>
</svg>