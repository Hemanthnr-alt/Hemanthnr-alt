<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 90" width="100%" height="100%">
  <defs>
    <linearGradient id="subdockBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="subdockBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07020d"/>
      <stop offset="50%" stop-color="#12051a"/>
      <stop offset="100%" stop-color="#0a0308"/>
    </linearGradient>

    <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
  </style>

  <!-- Container Dock Frame -->
  <rect x="2" y="2" width="836" height="86" rx="14" fill="url(#subdockBg)" stroke="url(#subdockBorder)" stroke-width="1.6"/>

  <!-- Left Side: Terminal Icon & Doctrine -->
  <circle cx="34" cy="45" r="16" fill="#1f0312" stroke="#ef4444" stroke-width="1"/>
  <text x="27" y="51" font-size="16">⚡</text>

  <text x="64" y="38" fill="url(#glowGold)" font-size="14.5" class="sans bold" letter-spacing="0.5">LOCAL-FIRST SYSTEMS ARCHITECT &amp; PRODUCT BUILDER</text>
  <text x="64" y="58" fill="#cbd5e1" font-size="11.5" class="mono">Deterministic On-Device SQLite &#8226; Zero Telemetry &#8226; Sub-1ms Latency</text>

  <!-- Right Side: Status Pills -->
  <rect x="670" y="20" width="144" height="22" rx="11" fill="#241403" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="684" cy="31" r="4" fill="#fbbf24"/>
  <text x="696" y="35" fill="#fbbf24" font-size="10" class="mono bold">LOCK IN v1.0 LIVE</text>

  <rect x="670" y="48" width="144" height="22" rx="11" fill="#240311" stroke="#ef4444" stroke-width="1"/>
  <circle cx="684" cy="59" r="4" fill="#ef4444"/>
  <text x="696" y="63" fill="#ef4444" font-size="10" class="mono bold">OPEN TO SWE ROLES</text>
</svg>